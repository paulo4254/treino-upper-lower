<meta name="description" content="Registro de treino Upper/Lower 4x por semana com carga, reps e RIR por série.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;background:#14161A;color:#F2F0EA;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #D4A72C;outline-offset:2px;border-radius:8px}
.wrap{min-height:100vh}
.header{padding:26px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:#9A9DA3;font-size:12px;letter-spacing:2px;text-transform:uppercase}.brand b{color:#D4A72C;font-size:20px}.title{font-size:31px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px}.sub{color:#9A9DA3;font-size:13px;line-height:1.4}
.weekring{flex-shrink:0;text-align:center}.ringwrap{position:relative;width:58px;height:58px}.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.wlabel{font-size:10px;color:#9A9DA3;letter-spacing:1px;text-transform:uppercase;margin-top:6px;font-variant-numeric:tabular-nums}
.days{padding:16px 20px 34px;display:flex;flex-direction:column;gap:12px}.day{position:relative;text-align:left;width:100%;background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:19px 20px;color:#F2F0EA;overflow:hidden;transition:transform .15s,border-color .15s,background .15s}.day:active{transform:scale(.985);background:#20242A}.bar{position:absolute;left:0;top:0;width:4px;height:100%}.daytop{display:flex;justify-content:space-between;align-items:center;gap:14px}.dayname{font-size:19px;font-weight:750}.focus{font-size:13.5px;color:#9A9DA3;margin-top:3px}.dayright{display:flex;align-items:center;gap:10px}.count{font-size:11.5px;border-radius:999px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.rest{margin-top:4px;padding:15px;border:1px dashed #2A2D33;border-radius:16px;color:#82868D;font-size:13px;text-align:center}

function safeGet(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch{return f}}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekKey(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const dayNum=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dayNum+3);const firstThursday=new Date(Date.UTC(d.getUTCFullYear(),0,4));const week=1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);return d.getUTCFullYear()+"-W"+String(week).padStart(2,"0")}
function fmtDate(iso){const [y,m,d]=iso.split("-");return d+"/"+m}
function key(d,n){return d+"|"+n}
function parseRange(s){const a=(String(s).match(/\d+/g)||[]).map(Number);return{lo:a[0]||0,hi:a[1]||a[0]||0}}
function rirMin(s){const a=(String(s).match(/\d+/g)||[]).map(Number);return a.length?Math.min(...a):0}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function photoUrl(rec){return rec?.blob?URL.createObjectURL(rec.blob):""}
async function addBodyPhoto(file,ownerId){
  if(!file)return;
  if(!ownerId){alert("Salve uma medição corporal antes de adicionar uma foto.");return}
  try{
    const rec=await storeBodyPhoto(file,ownerId);
    bodyPhotos.unshift(rec);
    renderProfile();
  }catch(err){console.error(err);alert("Não foi possível salvar a foto.")}
}
async function deleteBodyPhoto(id){
  const rec=bodyPhotos.find(x=>x.id===id);if(!rec||!confirm("Remover esta foto de evolução?"))return;
  rec.deletedAt=nowISO();rec.updatedAt=rec.deletedAt;
  if(ULDB.db)await ULDB.put("media",rec);
  bodyPhotos=bodyPhotos.filter(x=>x.id!==id);
  renderProfile();
}

function isAnchorExercise(e){return productPrefs.anchorExercises.includes(e.exerciseId)}

const dirtySessions=new Map();
let dirtyTimer=null;

function queueSessionWrite(s){
  if(!s?.id)return;
  dirtySessions.set(s.id,s);
  if(dirtyTimer)clearTimeout(dirtyTimer);
  dirtyTimer=setTimeout(()=>flushSessionWrites(),180);
}
async function flushSessionWrites(){
  if(dirtyTimer){clearTimeout(dirtyTimer);dirtyTimer=null}
  if(!ULDB.db||!dirtySessions.size)return;
  const batch=[...dirtySessions.values()];
  dirtySessions.clear();
  try{
    for(const s of batch)await ULDB.put("sessions",s);
    storageHealth={ok:true,lastError:"",lastWriteAt:nowISO()};
  }catch(err){
    batch.forEach(s=>dirtySessions.set(s.id,s));
    storageHealth={ok:false,lastError:String(err?.message||err),lastWriteAt:storageHealth.lastWriteAt};
    console.error("Falha ao salvar no IndexedDB",err);
  }
}

function stableKey(dayId,exerciseId){return dayId+"|"+exerciseId}
function sessionId(date,dayId,exerciseId){return "session:"+date+":"+dayId+":"+exerciseId}

const ULDB={name:"ul-treino-db",version:1,db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open(this.name,this.version);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("sessions")){const s=db.createObjectStore("sessions",{keyPath:"id"});s.createIndex("date","date");s.createIndex("exerciseId","exerciseId");s.createIndex("updatedAt","updatedAt")}if(!db.objectStoreNames.contains("bodyEntries")){const s=db.createObjectStore("bodyEntries",{keyPath:"id"});s.createIndex("date","date")}if(!db.objectStoreNames.contains("checkins")){const s=db.createObjectStore("checkins",{keyPath:"id"});s.createIndex("date","date",{unique:true})}if(!db.objectStoreNames.contains("media")){const s=db.createObjectStore("media",{keyPath:"id"});s.createIndex("ownerId","ownerId")}if(!db.objectStoreNames.contains("meta"))db.createObjectStore("meta",{keyPath:"key"})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},store(n,m="readonly"){return this.db.transaction(n,m).objectStore(n)},all(n){return new Promise((res,rej)=>{const r=this.store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},put(n,v){return new Promise((res,rej)=>{const r=this.store(n,"readwrite").put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)})},clear(n){return new Promise((res,rej)=>{const r=this.store(n,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},meta(k){return new Promise((res,rej)=>{const r=this.store("meta").get(k);r.onsuccess=()=>res(r.result?.value);r.onerror=()=>rej(r.error)})},setMeta(k,v){return this.put("meta",{key:k,value:v,updatedAt:nowISO()})}};

function cloneSet(x={}){return{id:x.id||uid("set"),load:x.load??"",reps:x.reps??"",rir:x.rir??"",done:!!x.done,createdAt:x.createdAt||nowISO(),updatedAt:x.updatedAt||nowISO(),deletedAt:x.deletedAt||null}}
function normalizeSession(raw,{date,dayId,exerciseId,series}){const stamp=raw.updatedAt||raw.createdAt||nowISO(),sets=(Array.isArray(raw.sets)?raw.sets:[]).map(cloneSet);while(sets.length<series)sets.push(cloneSet());return{id:raw.id||sessionId(date,dayId,exerciseId),schemaVersion:2,date,dayId,exerciseId,sets,note:raw.note||"",extra:Number(raw.extra||0),createdAt:raw.createdAt||stamp,updatedAt:stamp,deletedAt:raw.deletedAt||null}}
function cacheSession(s){if(!sessions[s.date])sessions[s.date]={};if(!sessions[s.date][s.dayId])sessions[s.date][s.dayId]={};sessions[s.date][s.dayId][s.exerciseId]=s}
function allSessionRecords(){const a=[];Object.values(sessions).forEach(d=>Object.values(d||{}).forEach(e=>Object.values(e||{}).forEach(s=>{if(s&&!s.deletedAt)a.push(s)})));return a}
function touchSession(s){s.updatedAt=nowISO();s.schemaVersion=2;s.sets.forEach(x=>{if(!x.id)x.id=uid("set");if(!x.createdAt)x.createdAt=s.createdAt||s.updatedAt;if(!x.updatedAt)x.updatedAt=s.updatedAt;if(x.deletedAt===undefined)x.deletedAt=null});queueSessionWrite(s)}

function migrateKeyedObject(obj){const out={};Object.entries(obj||{}).forEach(([k,v])=>{const p=k.indexOf("|");if(p<0){out[k]=v;return}const day=k.slice(0,p),old=k.slice(p+1),eid=exerciseIdFromName(old)||old;out[stableKey(day,eid)]=v});return out}
function migrateOrder(){const next={};Object.entries(exOrder||{}).forEach(([day,arr])=>{const d=DIAS.find(x=>x.id===day);if(!d||!Array.isArray(arr))return;next[day]=arr.map(v=>d.exercicios.find(e=>e.exerciseId===v)?.exerciseId||d.exercicios.find(e=>e.nome===v)?.exerciseId).filter(Boolean)});exOrder=next}

async function resizePhotoFile(file,maxSide=1600,quality=.82){
  if(!file||!file.type?.startsWith("image/"))throw new Error("Arquivo não é uma imagem.");
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});ctx.drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();
  const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error("Falha ao comprimir imagem.")),"image/jpeg",quality));
  return{blob,width:w,height:h,type:"image/jpeg",bytes:blob.size};
}
async function storeBodyPhoto(file,bodyEntryId){

function curDate(){return viewDate||todayISO()}
function isToday(){return curDate()===todayISO()}
function shiftDate(days){
  const [y,m,d]=curDate().split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+days);
  viewDate=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  if(viewDate>todayISO())viewDate=todayISO();
  renderDay();
}
function setDate(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return;
  viewDate=v>todayISO()?todayISO():v;
  renderDay();
}
function fmtDateLong(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  const dias=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  return dias[dt.getDay()]+", "+String(d).padStart(2,"0")+"/"+String(m).padStart(2,"0");
}

// ---------- ordem personalizada dos exercicios ----------
function orderedIdx(d){
  const saved=exOrder[d.id];
  const all=d.exercicios.map((e,i)=>i);
  if(!Array.isArray(saved))return all;
  const byName=new Map(d.exercicios.map((e,i)=>[e.exerciseId,i]));
  const out=[];
  saved.forEach(n=>{if(byName.has(n)&&!out.includes(byName.get(n)))out.push(byName.get(n))});
  all.forEach(i=>{if(!out.includes(i))out.push(i)});
  return out;
}
function moveExercise(dayId,idx,dir){
  const d=DIAS.find(x=>x.id===dayId);
  const ord=orderedIdx(d);
  const pos=ord.indexOf(idx);
  const target=pos+dir;
  if(pos<0||target<0||target>=ord.length)return;
  ord.splice(target,0,ord.splice(pos,1)[0]);
  exOrder[d.id]=ord.map(i=>d.exercicios[i].exerciseId);
  vibrate(15);
  save();
  renderDay();
}
function resetOrder(){
  const d=DIAS.find(x=>x.id===active);
  if(!d)return;
  delete exOrder[d.id];
  save();
  renderDay();
}

// ---------- series extras ----------
function setCount(s,e){return Math.max(e.series,e.series+(s.extra||0))}
function addSet(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.exerciseId,e.series);
  if((s.extra||0)>=4)return;
  s.extra=(s.extra||0)+1;
  while(s.sets.filter(x=>!x.deletedAt).length<setCount(s,e))s.sets.push(cloneSet());touchSession(s);
  vibrate(15);
  save();
  updateCard(dayId,idx);
}
function removeSet(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.exerciseId,e.series);
  if(!s.extra)return;
  s.extra-=1;
  const a=s.sets.filter(x=>!x.deletedAt),last=a.at(-1);if(last){last.deletedAt=nowISO();last.updatedAt=last.deletedAt}touchSession(s);
  vibrate(15);
  save();
  updateCard(dayId,idx);
}

function save(){localStorage.setItem("treino-ordem-ul-v2",JSON.stringify(exOrder));localStorage.setItem("treino-videos-ok-ul",JSON.stringify(videoOk));localStorage.setItem("treino-videos-ul-v1",JSON.stringify(customVideos));localStorage.setItem("treino-notas-dia-ul-v2",JSON.stringify(dayNotes))}
function sessionFor(date,dayId,exerciseId,series){if(!sessions[date])sessions[date]={};if(!sessions[date][dayId])sessions[date][dayId]={};if(!sessions[date][dayId][exerciseId])sessions[date][dayId][exerciseId]=normalizeSession({},{date,dayId,exerciseId,series});const x=sessions[date][dayId][exerciseId];if(x.extra==null)x.extra=0;while(x.sets.filter(z=>!z.deletedAt).length<series+x.extra)x.sets.push(cloneSet());return x}
function getSession(date,dayId,exerciseId){return sessions?.[date]?.[dayId]?.[exerciseId]||null}
function exerciseDone(date,dayId,e){const s=getSession(date,dayId,e.exerciseId);if(!s)return false;const a=s.sets.filter(x=>!x.deletedAt),c=e.series+(s.extra||0);return a.slice(0,c).length===c&&a.slice(0,c).every(x=>x.done)}
function dayDoneCount(d,date){return d.exercicios.filter(e=>exerciseDone(date||todayISO(),d.id,e)).length}
function completedSetsToday(){let n=0,total=0;DIAS.forEach(d=>d.exercicios.forEach(e=>{total+=e.series;const s=getSession(todayISO(),d.id,e.exerciseId);if(s)n+=s.sets.filter(x=>!x.deletedAt).slice(0,e.series+(s.extra||0)).filter(x=>x.done).length}));return{n,total}}

function ringSVG(pct,size,stroke,color,track){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle class="ring-fg" data-target="${c*(1-pct)}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}

function priorSessions(dayId,e){const out=[];Object.keys(sessions).sort().reverse().forEach(date=>{if(date===curDate())return;const ss=getSession(date,dayId,e.exerciseId);if(ss&&ss.sets.some(x=>!x.deletedAt&&(x.done||x.load||x.reps)))out.push({date,...ss})});return out}
function legacyHistory(dayId,e){return (legacyLoads[key(dayId,e.nome)]||[]).slice().sort((a,b)=>a.d<b.d?1:-1)}
function sessionSummary(s){const a=s.sets.filter(x=>!x.deletedAt&&(x.done||x.load||x.reps));if(!a.length)return"sem dados";return a.map(x=>`${x.load?x.load+"kg":"—"} × ${x.reps||"—"}${x.rir!==""?` · RIR ${x.rir}`:""}`).join(" | ")}
function recommendation(dayId,e,s){
  const sets=s.sets.filter(x=>!x.deletedAt).slice(0,e.series);
  if(sets.length<e.series||!sets.every(x=>x.done))return null;

  const complete=sets.every(x=>String(x.load??"").trim()!==""&&String(x.reps??"").trim()!==""&&String(x.rir??"").trim()!=="");
  if(!complete)return{txt:"Complete carga, reps e RIR de todas as séries para liberar a recomendação.",cls:"warn",confidence:"baixa"};

  const {lo,hi}=parseRange(e.reps),targetMin=rirMin(e.rir);
  const reps=sets.map(x=>Number(x.reps)),rirs=sets.map(x=>Number(x.rir)),loads=sets.map(x=>Number(x.load));
  if([...reps,...rirs,...loads].some(v=>!Number.isFinite(v)))return{txt:"Há um valor inválido nesta sessão. Corrija antes da recomendação.",cls:"warn",confidence:"baixa"};

  const sameLoad=loads.every(v=>Math.abs(v-loads[0])<1e-9);
  const currentLoad=Math.max(...loads);
  const allTop=reps.every(r=>r>=hi);
  const allAtLeastLo=reps.every(r=>r>=lo);
  const effortOk=rirs.every(r=>r>=targetMin);
  const tooHard=rirs.filter(r=>r<=0).length>=2;
  const avgRir=rirs.reduce((a,b)=>a+b,0)/rirs.length;

  const recent=priorSessions(dayId,e).filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    return a.length===e.series&&a.every(z=>z.done&&String(z.load).trim()!==""&&String(z.reps).trim()!==""&&String(z.rir).trim()!=="");
  }).slice(0,3);

  const comparable=recent.filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    const max=Math.max(...a.map(z=>Number(z.load)));
    return Number.isFinite(max)&&Math.abs(max-currentLoad)<1e-9;
  });

  const priorStrong=comparable.filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    return a.every(z=>Number(z.reps)>=Math.max(lo,hi-1)&&Number(z.rir)>=targetMin);
  }).length;

  if(!sameLoad)return{txt:"Você usou cargas diferentes entre as séries. O registro é válido, mas a sugestão automática fica menos confiável. Compare a próxima sessão antes de progredir.",cls:"",confidence:"média"};

  if(allTop&&effortOk){
    if(priorStrong>=1){
      const why=`${priorStrong+1} exposições fortes na mesma carga; todas as séries chegaram ao topo da faixa com RIR ≥ ${targetMin}.`;
      return{txt:"Desempenho forte repetido. Teste o menor aumento de carga disponível na próxima sessão.",why,cls:"good",confidence:isAnchorExercise(e)?"alta":"média"};
    }
    return{txt:"Topo da faixa atingido com RIR adequado. Repita esse desempenho mais uma vez antes de subir a carga.",why:`Primeira confirmação forte nesta carga; o app ainda quer mais uma exposição comparável.`,cls:"good",confidence:"média"};
  }
  if(!allAtLeastLo||tooHard)return{txt:"A carga está pesada para a faixa-alvo ou o esforço ficou muito alto. Mantenha ou reduza levemente e priorize técnica e recuperação.",cls:"warn",confidence:"alta"};
  if(avgRir>targetMin+2&&reps.every(r=>r>=lo))return{txt:"Você ficou claramente acima do RIR previsto. Mantenha a técnica e tente mais repetições antes de aumentar a carga.",cls:"",confidence:"média"};
  return{txt:"Sessão dentro do alvo. Mantenha a carga e tente acumular repetições com o RIR prescrito.",why:`Faixa ${lo}–${hi} reps; RIR-alvo mínimo ${targetMin}; ainda não há evidência suficiente para subir a carga.`,cls:"",confidence:"média"};
}
function trendPoints(dayId,e){const pts=[];Object.keys(sessions).sort().forEach(date=>{const ss=getSession(date,dayId,e.exerciseId);if(!ss)return;const vals=ss.sets.filter(x=>!x.deletedAt&&x.done&&x.load).map(x=>Number(x.load)).filter(Number.isFinite);if(vals.length)pts.push({d:date,v:Math.max(...vals)})});legacyHistory(dayId,e).slice().reverse().forEach(h=>{const v=Number(h.v);if(Number.isFinite(v))pts.push({d:h.d,v,legacy:true})});pts.sort((a,b)=>a.d.localeCompare(b.d));return pts.slice(-12)}
function sparkSVG(points,color){const W=100,H=30,pad=3,vals=points.map(p=>p.v),min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1;const c=points.map((p,i)=>({x:(i/(points.length-1||1))*(W-pad*2)+pad,y:H-pad-((p.v-min)/range)*(H-pad*2)}));const line=c.map((p,i)=>(i?"L":"M")+p.x.toFixed(2)+" "+p.y.toFixed(2)).join(" ");return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${c.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="${color}"/>`).join("")}</svg>`}

function backupInfo(){let iso=null;try{iso=localStorage.getItem("treino-ul-ultimo-backup")}catch{}const tem=Object.keys(sessions).length||Object.keys(legacyLoads).length;if(!iso)return{atrasado:!!tem,nunca:true,dias:null};const d=new Date(iso),dias=Math.floor((Date.now()-d)/86400000);return{atrasado:!!tem&&dias>=14,nunca:false,dias,data:d}}

function isoDateObj(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function isoFromDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mondayOf(date){const d=new Date(date);const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d}
function fmtLong(iso){return isoDateObj(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}
function workoutDayForDate(date){
  const n=date.getDay();
  return n===1?DIAS[0]:n===2?DIAS[1]:n===4?DIAS[2]:n===5?DIAS[3]:null
}
function nextWorkout(){
  const now=new Date();
  for(let i=0;i<8;i++){const d=new Date(now);d.setDate(now.getDate()+i);const w=workoutDayForDate(d);if(w)return{day:w,date:d}}
  return null
}
function sessionDates(){
  return Object.keys(sessions||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
}
function workoutProgressOn(date,day){
  if(!day)return{done:0,total:0,sets:0};
  let done=0,total=day.exercicios.length,sets=0;
  day.exercicios.forEach(e=>{
    const s=getSession(date,day.id,e.exerciseId);
    if(s){
      // descarta séries apagadas antes de recortar, igual a exerciseDone/completedSetsToday
      const ativas=s.sets.filter(x=>!x.deletedAt);
      const c=ativas.slice(0,setCount(s,e)).filter(x=>x.done).length;
      sets+=c;
      if(c>=e.series)done++;
    }
  });
  return{done,total,sets}
}
function weeklyStats(){
  const mon=mondayOf(new Date()), vals=[];
  let completed=0,planned=0,sets=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const w=workoutDayForDate(d); if(!w)continue;
    planned++;
    const p=workoutProgressOn(isoFromDate(d),w);sets+=p.sets;
    if(p.done===p.total)completed++;
    vals.push({date:d,day:w,p});
  }
  return{completed,planned,sets,vals}
}
function totalCompletedSets(){
  let n=0;
  Object.values(sessions||{}).forEach(byDay=>{
    if(!byDay||typeof byDay!=="object")return;
    Object.values(byDay).forEach(byEx=>{
      if(!byEx||typeof byEx!=="object")return;
      Object.values(byEx).forEach(ex=>{if(ex&&Array.isArray(ex.sets))n+=ex.sets.filter(x=>x.done&&!x.deletedAt).length});
    });
  });
  return n;
}
function getReadiness(){return checkins[todayISO()]||{energy:0,sleep:0,motivation:0}}
function checkinScore(c){const a=[c.energy,c.sleep,c.motivation].filter(Boolean);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*20):0}
function mostRecentWorkout(){
  const dates=sessionDates().reverse();
  for(const date of dates){
    for(const d of DIAS){const p=workoutProgressOn(date,d);if(p.sets>0)return{date,day:d,p}}
  }
  return null
}

function bodyDelta(field){

}

/* ---------- séries temporais para o dashboard ---------- */

/** Volume de uma data: soma de carga × reps das séries concluídas e não apagadas. */
function volumeOnDate(date){
  let v=0;
  DIAS.forEach(d=>d.exercicios.forEach(e=>{
    const s=getSession(date,d.id,e.exerciseId);
    if(!s)return;
    s.sets.forEach(x=>{
      if(!x.done||x.deletedAt)return;
      const l=Number(x.load),r=Number(x.reps);
      if(Number.isFinite(l)&&Number.isFinite(r))v+=l*r;
    });
  }));
  return v;
}

/**
 * Últimas `n` semanas (segunda a domingo), da mais antiga para a mais recente.
 * Cada item: volume total, treinos completos, treinos planejados e séries.
 * A semana corrente entra parcial — é o esperado num painel.
 */
function weekSeries(n=8,ref=new Date()){
  const out=[],base=mondayOf(ref);
  for(let w=n-1;w>=0;w--){
    const mon=new Date(base);mon.setDate(base.getDate()-w*7);
    let volume=0,sets=0,completed=0,planned=0;
    for(let i=0;i<7;i++){
      const d=new Date(mon);d.setDate(mon.getDate()+i);
      const wd=workoutDayForDate(d);if(!wd)continue;
      planned++;
      const iso=isoFromDate(d),p=workoutProgressOn(iso,wd);
      sets+=p.sets;volume+=volumeOnDate(iso);
      if(p.total&&p.done===p.total)completed++;
    }
    out.push({start:isoFromDate(mon),label:fmtDate(isoFromDate(mon)),volume:Math.round(volume),sets,completed,planned});
  }
  return out;
}

/**
 * Sequência atual de dias de treino planejados que foram concluídos,
 * contando para trás. Dias sem treino previsto não quebram a sequência.
 * O dia de hoje, se ainda estiver incompleto, também não quebra.
 */
function currentStreak(ref=new Date()){
  let streak=0;
  const hoje=isoFromDate(ref);
  for(let i=0;i<180;i++){
    const d=new Date(ref);d.setDate(ref.getDate()-i);
    const wd=workoutDayForDate(d);
    if(!wd)continue;
    const iso=isoFromDate(d),p=workoutProgressOn(iso,wd);
    const completo=p.total&&p.done===p.total;
    if(completo){streak++;continue}
    if(iso===hoje)continue; // hoje ainda dá tempo
    break;
  }
  return streak;
}

/** Melhor série da semana corrente por 1RM estimado, para destaque no painel. */
function bestSetOfWeek(ref=new Date()){
  const mon=mondayOf(ref);let best=null;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const iso=isoFromDate(d);
    DIAS.forEach(day=>day.exercicios.forEach(e=>{
      const s=getSession(iso,day.id,e.exerciseId);
      if(!s)return;
      s.sets.forEach(x=>{
        if(!x.done||x.deletedAt)return;
        const est=estimated1RM(x.load,x.reps);
        if(est==null)return;
        if(!best||est>best.est)best={est,load:Number(x.load),reps:Number(x.reps),name:e.nome,date:iso};
      });
    }));
  }
  return best;
}

/** Variação percentual entre as duas últimas semanas com volume registrado. */
function volumeTrend(series){
  const comVolume=series.filter(w=>w.volume>0);
  if(comVolume.length<2)return null;
  const atual=comVolume.at(-1).volume,anterior=comVolume.at(-2).volume;
  if(!anterior)return null;
  return Math.round(((atual-anterior)/anterior)*100);
}



function migrationReport(){
  const legacyDates=Object.keys(LEGACY_SESSION_SNAPSHOT||{}).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
  const current=allSessionRecords();
  const legacyCount=legacyDates.reduce((n,date)=>{
    const byDay=LEGACY_SESSION_SNAPSHOT[date]||{};
    return n+Object.values(byDay).reduce((s,byEx)=>s+Object.keys(byEx||{}).length,0);
  },0);
  const unmatched=[];
  legacyDates.forEach(date=>{
    const byDay=LEGACY_SESSION_SNAPSHOT[date]||{};
    Object.entries(byDay).forEach(([day,byEx])=>{
      Object.keys(byEx||{}).forEach(name=>{if(!exerciseIdFromName(name))unmatched.push({date,day,name})});
    });
  });
  return {legacyCount,migratedCount:current.length,unmatched,exact:(legacyCount===0||legacyCount===current.length)&&unmatched.length===0};
}

}

function sessionCountsByExercise(){
  const map=new Map();
  allSessionRecords().forEach(s=>{
    const e=exerciseById(s.exerciseId);
    const label=e?.nome||s.exerciseId;
    if(!map.has(s.exerciseId))map.set(s.exerciseId,{exerciseId:s.exerciseId,label,count:0,sets:0});
    const row=map.get(s.exerciseId);
    row.count++;
    row.sets+=s.sets.filter(x=>!x.deletedAt&&x.done).length;
  });
  return [...map.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,"pt-BR"));
}

async function restoreLocalRecoveryPoint(){
  const snap=await getLocalRecoveryPoint();
  if(!snap)throw new Error("Nenhum ponto de recuperação local foi criado.");
  if(!confirm("Restaurar o ponto de recuperação local? Os dados atuais serão substituídos."))return false;

  await ULDB.clear("sessions");
  sessions={};
  for(const raw of snap.sessions||[]){
    const e=exerciseById(raw.exerciseId);
    const s=normalizeSession(raw,{date:raw.date,dayId:raw.dayId,exerciseId:raw.exerciseId,series:e?.series||raw.sets?.length||1});
    cacheSession(s);await ULDB.put("sessions",s);
  }
  dayNotes=snap.dayNotes||{};
  customVideos=snap.customVideos||{};
  legacyLoads=snap.legacyLoads||{};
  legacyDone=snap.legacyDone||{};
  exOrder=snap.exOrder||{};
  videoOk=snap.videoOk||{};
  profile=snap.profile||profile;
  bodyLog=Array.isArray(snap.bodyLog)?snap.bodyLog:[];
  checkins=snap.checkins||{};
  migrateOrder();savingLegacy();save();await saveV2();

  if(ULDB.db){
    await ULDB.clear("bodyEntries");
    await ULDB.clear("checkins");
    for(const x of bodyLog)await ULDB.put("bodyEntries",x);
    for(const x of Object.values(checkins))await ULDB.put("checkins",x);
  }
  return true;
}

function runIntegrityCheck(){
  const issues=[],ids=new Set(),catalog=new Set();
  // O mesmo movimento pode aparecer em mais de um dia do programa e nesse caso
  // deve manter o mesmo exerciseId — é isso que unifica histórico e recordes.
  // Colisão real só existe se o id se repetir dentro do MESMO dia, porque a
  // chave da sessão é date:dayId:exerciseId.
  DIAS.forEach(d=>{
    const noDia=new Set();
    d.exercicios.forEach(e=>{
      if(!e.exerciseId){issues.push("Exercício sem exerciseId: "+e.nome);return}
      if(noDia.has(e.exerciseId))issues.push("exerciseId repetido no mesmo dia ("+d.label+"): "+e.exerciseId);
      noDia.add(e.exerciseId);
      catalog.add(e.exerciseId);
    });
  });
  allSessionRecords().forEach(s=>{
    if(!s.id)issues.push("Sessão sem id.");
    else if(ids.has(s.id))issues.push("ID de sessão duplicado: "+s.id);
    else ids.add(s.id);
    if(!catalog.has(s.exerciseId))issues.push("Sessão órfã: "+s.exerciseId);
    if(!s.createdAt||!s.updatedAt)issues.push("Sessão sem timestamps: "+s.id);
    if(!Array.isArray(s.sets))issues.push("Sessão sem séries: "+s.id);
    else s.sets.forEach((x,i)=>{
      if(!x.id)issues.push("Série sem id em "+s.id+" #"+(i+1));
      if(x.rir!==""&&x.rir!=null&&!Number.isFinite(Number(x.rir)))issues.push("RIR inválido em "+s.id);
      if(x.reps!==""&&x.reps!=null&&!Number.isFinite(Number(x.reps)))issues.push("Reps inválidas em "+s.id);
      if(x.load!==""&&x.load!=null&&!Number.isFinite(Number(x.load)))issues.push("Carga inválida em "+s.id);
    });
  });
  bodyLog.forEach(x=>{if(!x.id||!x.updatedAt)issues.push("Medição corporal incompleta: "+(x.date||"sem data"))});
  Object.values(checkins).forEach(x=>{if(!x.id||!x.updatedAt)issues.push("Check-in incompleto: "+(x.date||"sem data"))});
  return{ok:issues.length===0,issues,sessions:allSessionRecords().length,body:bodyLog.length,checkins:Object.keys(checkins).length,exerciseIds:catalog.size,storage:storageHealth};
}
function showIntegrityCheck(){
  const r=runIntegrityCheck();
  const storage=r.storage.ok?"armazenamento OK":"erro de armazenamento";
  if(r.ok)alert(`Integridade OK.\n\n${r.exerciseIds} exercícios com IDs estáveis\n${r.sessions} sessões\n${r.body} medições corporais\n${r.checkins} check-ins\n${storage}`);
  else alert("Foram encontrados "+r.issues.length+" problema(s):\n\n"+r.issues.slice(0,12).join("\n")+(r.issues.length>12?"\n…":""));
}

function bodyChart(field){

  const vals=pts.map(p=>+p[field]),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,W=300,H=115,pad=10;
  const cs=pts.map((p,i)=>({x:pad+i*(W-pad*2)/(pts.length-1),y:H-pad-(+p[field]-min)/range*(H-pad*2)}));
  const line=cs.map((c,i)=>(i?"L":"M")+c.x.toFixed(1)+" "+c.y.toFixed(1)).join(" ");
  return `<div class="v2chart"><svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="#D4A72C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${cs.map(c=>`<circle cx="${c.x}" cy="${c.y}" r="3" fill="#D4A72C"/>`).join("")}</svg><div class="v2chart-foot"><span>${fmtLong(pts[0].date)} · ${pts[0][field]}</span><span>${fmtLong(pts.at(-1).date)} · ${pts.at(-1)[field]}</span></div></div>`;
}

function estimated1RM(load,reps){
  load=Number(load);reps=Number(reps);
  if(!Number.isFinite(load)||!Number.isFinite(reps)||load<=0||reps<=0)return null;
  if(reps===1)return load;
  if(reps>15)return null;
  return load*(1+reps/30);
}
function exerciseRecords(dayId,e){
  let bestLoad=null,bestE1RM=null,bestVolumeSet=null,bestDate=null;
  Object.keys(sessions).sort().forEach(date=>{
    const s=getSession(date,dayId,e.exerciseId);if(!s)return;
    s.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{
      const load=Number(x.load),reps=Number(x.reps);
      if(Number.isFinite(load)&&load>0&&(bestLoad==null||load>bestLoad)){bestLoad=load;bestDate=date}
      const one=estimated1RM(load,reps);
      if(one!=null&&(bestE1RM==null||one>bestE1RM))bestE1RM=one;
      const vol=load*reps;
      if(Number.isFinite(vol)&&vol>0&&(bestVolumeSet==null||vol>bestVolumeSet))bestVolumeSet=vol;
    })
  });
  return{bestLoad,bestE1RM,bestVolumeSet,bestDate}
}
function currentSessionPRs(dayId,e,s){
  const hist=exerciseRecords(dayId,e);
  const vals=s.sets.filter(x=>!x.deletedAt&&x.done);
  if(!vals.length)return[];
  const maxLoad=Math.max(...vals.map(x=>Number(x.load)).filter(Number.isFinite),-Infinity);
  const maxE=Math.max(...vals.map(x=>estimated1RM(x.load,x.reps)).filter(x=>x!=null),-Infinity);
  const maxV=Math.max(...vals.map(x=>Number(x.load)*Number(x.reps)).filter(Number.isFinite),-Infinity);
  const prior=priorSessions(dayId,e);
  let prevLoad=-Infinity,prevE=-Infinity,prevV=-Infinity;
  prior.forEach(ps=>ps.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{
    const l=Number(x.load),r=Number(x.reps),er=estimated1RM(l,r),v=l*r;
    if(Number.isFinite(l))prevLoad=Math.max(prevLoad,l);
    if(er!=null)prevE=Math.max(prevE,er);
    if(Number.isFinite(v))prevV=Math.max(prevV,v);
  }));
  const out=[];
  if(Number.isFinite(maxLoad)&&maxLoad>prevLoad)out.push("PR carga");
  if(Number.isFinite(maxE)&&maxE>prevE)out.push("PR e1RM");
  if(Number.isFinite(maxV)&&maxV>prevV)out.push("PR série");
  return out;
}
function monthStats(date=new Date()){
  const y=date.getFullYear(),m=date.getMonth(),prefix=y+"-"+String(m+1).padStart(2,"0")+"-";
  const rows=allSessionRecords().filter(s=>s.date.startsWith(prefix));
  const completedSets=rows.reduce((n,s)=>n+s.sets.filter(x=>!x.deletedAt&&x.done).length,0);
  const dates=new Set(rows.filter(s=>s.sets.some(x=>!x.deletedAt&&x.done)).map(s=>s.date));
  let volume=0;
  rows.forEach(s=>s.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{const l=Number(x.load),r=Number(x.reps);if(Number.isFinite(l)&&Number.isFinite(r))volume+=l*r}));
  const body=bodyLog.filter(x=>x.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
  const weightDelta=body.length>=2&&body[0].weight&&body.at(-1).weight?(Number(body.at(-1).weight)-Number(body[0].weight)):null;
  return{workoutDays:dates.size,completedSets,volume:Math.round(volume),weightDelta}
}
function warmupPlan(load,e){
  load=Number(load);
  if(!Number.isFinite(load)||load<=0)return[];
  const compound=["Peito","Costas","Quadríceps","Posterior","Glúteos"].includes(e.grupo);
  const p=compound?[[.4,8],[.6,5],[.75,3],[.88,1]]:[[.5,8],[.7,4]];
  return p.map(([pct,reps],i)=>({label:"Aquecimento "+(i+1),load:Math.max(1,Math.round(load*pct*2)/2),reps,pct:Math.round(pct*100)}));
}

function allPRs(){
  // Um exercício pode estar em mais de um dia (ex.: remada na segunda e na quinta).
  // O recorde é do movimento, não da posição no programa: agrupa por exerciseId.
  const porExercicio=new Map();
  DIAS.forEach(d=>d.exercicios.forEach(e=>{
    Object.keys(sessions||{}).forEach(date=>{
      const s=getSession(date,d.id,e.exerciseId);
      if(!s||!Array.isArray(s.sets))return;
      s.sets.forEach(x=>{
        const v=parseFloat(x.load);
        if(!Number.isFinite(v)||!x.done||x.deletedAt)return;
        const atual=porExercicio.get(e.exerciseId);
        if(!atual)porExercicio.set(e.exerciseId,{name:e.nome,value:v,group:e.grupo});
        else if(v>atual.value)atual.value=v;
      });
    });
  }));
  return [...porExercicio.values()].sort((a,b)=>b.value-a.value);
}

function exerciseCard(d,e,i,date){
  const s=sessionFor(date,d.id,e.exerciseId,e.series),activeSets=s.sets.filter(x=>!x.deletedAt),count=e.series+(s.extra||0);
  const done=exerciseDone(date,d.id,e),vid=videoFor(d.id,e),prior=priorSessions(d.id,e),legacy=legacyHistory(d.id,e);
  const prev=prior[0],rec=recommendation(d.id,e,s),points=trendPoints(d.id,e);
  const k=stableKey(d.id,e.exerciseId);
  const ord=orderedIdx(d),pos=ord.indexOf(i);

  const previousHtml=prev
    ?`<div class="prevbox"><b>Última sessão ${fmtDate(prev.date)}</b><br>${esc(sessionSummary(prev))}</div>`
    :legacy[0]
      ?`<div class="prevbox legacy"><b>Histórico antigo ${fmtDate(legacy[0].d)}</b><br>${esc(legacy[0].v||"—")}kg${legacy[0].r!=null?` · ${legacy[0].r} reps`:""}</div>`
      :`<div class="prevbox">Primeira sessão detalhada neste exercício.</div>`;

  const history=[
    ...prior.slice(0,6).map(x=>`<div class="histitem"><b>${fmtDate(x.date)}</b><br>${esc(sessionSummary(x))}${x.note?`<br>Nota: ${esc(x.note)}`:""}</div>`),

let timerEnd=0,timerInterval=null,timerLabel="";
function persistTimer(){
  try{
    if(timerEnd)localStorage.setItem("treino-timer-ul",JSON.stringify({end:timerEnd,label:timerLabel}));
    else localStorage.removeItem("treino-timer-ul");
  }catch(e){}
}
// o iOS congela o app em segundo plano: retoma o descanso pelo horario-alvo salvo
function restoreTimer(){
  try{
    const raw=localStorage.getItem("treino-timer-ul");
    if(!raw){timerEnd=0;updateTimerUI();return}
    const t=JSON.parse(raw);
    if(!t||!t.end||t.end<=Date.now()){localStorage.removeItem("treino-timer-ul");timerEnd=0;updateTimerUI();return}
    timerEnd=t.end;timerLabel=t.label||"";
    if(timerInterval)clearInterval(timerInterval);
    timerInterval=setInterval(updateTimerUI,250);
    updateTimerUI();
  }catch(e){}
}
function formatTimer(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(seconds,label=""){timerEnd=Date.now()+seconds*1000;timerLabel=label;persistTimer();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerUI,250);const p=document.getElementById("timer-panel");if(p)p.hidden=true;updateTimerUI()}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerEnd=0;timerLabel="";persistTimer();updateTimerUI()}
function updateTimerUI(){const fab=document.getElementById("timer-fab"),ctx=document.getElementById("timer-context");if(!fab)return;if(!timerEnd){fab.textContent="⏱ Descanso";fab.classList.remove("running");return}const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));fab.textContent="⏱ "+formatTimer(left);fab.classList.add("running");if(ctx&&timerLabel)ctx.textContent=timerLabel+" · descanso em andamento";if(left<=0){clearInterval(timerInterval);timerInterval=null;timerEnd=0;timerLabel="";persistTimer();fab.textContent="✓ Descanso";fab.classList.remove("running");vibrate([200,100,200,100,300]);setTimeout(updateTimerUI,1800)}}

const ANILHAS=[25,20,15,10,5,2.5,1.25];
function openPlateCalculator(){
  vibrate(15);
  document.getElementById("modal-root").innerHTML=`<div class="modal-overlay" data-action="close-calc"><div class="modal" data-stop="1">
    <div class="modal-title"><span>Calculadora de anilhas</span><button class="modal-close" data-action="close-calc">×</button></div>
    <div class="modal-field"><label>Peso total desejado (barra + anilhas, kg)</label><input type="number" id="calc-total" class="modal-input" placeholder="Ex: 80" inputmode="decimal" step="0.5"></div>
    <div class="modal-field"><label>Peso da barra (kg)</label><input type="number" id="calc-bar" class="modal-input" value="20" inputmode="decimal" step="0.5"></div>
    <button class="toolbtn" style="width:100%" data-action="calc-plates">Calcular por lado</button>
    <div id="calc-output"></div>
  </div></div>`;
  const t=document.getElementById("calc-total");if(t)t.focus();
}
function closePlateCalculator(){const r=document.getElementById("modal-root");if(r)r.innerHTML=""}
function computePlates(){
  const out=document.getElementById("calc-output");if(!out)return;
  const total=parseFloat(String(document.getElementById("calc-total").value).replace(",","."));
  const bar=parseFloat(String(document.getElementById("calc-bar").value).replace(",","."))||0;
  if(!Number.isFinite(total)){out.innerHTML=`<div class="plate-result err">Informe o peso total.</div>`;return}
  if(total<bar){out.innerHTML=`<div class="plate-result err">O peso total não pode ser menor que a barra.</div>`;return}
  if(total===bar){out.innerHTML=`<div class="plate-result">Só a barra — sem anilhas.</div>`;return}
  let rem=Math.round(((total-bar)/2)*100)/100;
  const usadas=[];
  for(const pl of ANILHAS){const c=Math.floor(rem/pl);if(c>0){usadas.push(c+"× "+pl+"kg");rem=Math.round((rem-c*pl)*100)/100}}
  const sobra=rem>0?`<br><small>Faltam ${rem}kg por lado — o mais próximo montável é ${total-rem*2}kg.</small>`:"";
  out.innerHTML=`<div class="plate-result"><b>Por lado da barra:</b><br>${usadas.length?usadas.join("<br>"):"—"}${sobra}</div>`;
  vibrate(15);
}

function buildBackupPayloadObject(){
  return {app:"Upper/Lower",version:8,schemaVersion:2,exportedAt:nowISO(),sessionRecords:allSessionRecords(),dayNotes,customVideos,legacyLoads,legacyDone,exOrder,videoOk,profile,bodyLog,checkins:Object.values(checkins)};
}
function validateRoundTrip(){
  const payload=buildBackupPayloadObject();
  const prepared=prepareImportedBackup(payload);
  const a=payload.sessionRecords.length,b=prepared.sessions.length;
  const idsA=new Set(payload.sessionRecords.map(x=>x.id));
  const idsB=new Set(prepared.sessions.map(x=>x.id));
  const missing=[...idsA].filter(x=>!idsB.has(x));
  return {ok:a===b&&missing.length===0,exported:a,imported:b,missing};
}
function showRoundTripTest(){
  const r=validateRoundTrip();
  alert(r.ok?`Backup round-trip OK.\n\n${r.exported} sessões exportadas e ${r.imported} validadas para reimportação.`:`Falha no round-trip.\n\nExportadas: ${r.exported}\nImportadas: ${r.imported}\nIDs ausentes: ${r.missing.length}`);
}

function prepareImportedBackup(data){
  if(!data||typeof data!=="object")throw new Error("Formato inválido");
  const prepared={sessions:[],dayNotes:{},customVideos:{},legacyLoads:{},legacyDone:{},exOrder:{},videoOk:{},profile:profile,bodyLog:[],checkins:{}};
  if(data.version>=8&&Array.isArray(data.sessionRecords)){
    for(const raw of data.sessionRecords){
      if(!raw?.date||!raw?.dayId||!raw?.exerciseId)throw new Error("Sessão incompleta no backup");
      const e=exerciseById(raw.exerciseId);if(!e)throw new Error("Exercício desconhecido: "+raw.exerciseId);
      prepared.sessions.push(normalizeSession(raw,{date:raw.date,dayId:raw.dayId,exerciseId:raw.exerciseId,series:e.series}));
    }
    Object.assign(prepared,{dayNotes:data.dayNotes||{},customVideos:data.customVideos||{},legacyLoads:data.legacyLoads||{},legacyDone:data.legacyDone||{},exOrder:data.exOrder||{},videoOk:data.videoOk||{},profile:data.profile||profile,bodyLog:Array.isArray(data.bodyLog)?data.bodyLog:[]});
    (Array.isArray(data.checkins)?data.checkins:Object.values(data.checkins||{})).forEach(x=>{if(x?.date)prepared.checkins[x.date]=x});
  }else if(data.version>=5){
    for(const [date,byDay] of Object.entries(data.sessions||{}))for(const [day,byName] of Object.entries(byDay||{}))for(const [name,raw] of Object.entries(byName||{})){
      const eid=exerciseIdFromName(name)||name,e=exerciseById(eid);if(!e)continue;
      prepared.sessions.push(normalizeSession(raw,{date,dayId:day,exerciseId:eid,series:e.series}));
    }
    prepared.dayNotes=data.dayNotes||{};prepared.customVideos=migrateKeyedObject(data.customVideos||{});prepared.legacyLoads=data.legacyLoads||{};prepared.legacyDone=data.legacyDone||{};prepared.exOrder=data.exOrder||{};prepared.videoOk=migrateKeyedObject(data.videoOk||{});
    if(data.version>=7){prepared.profile=data.profile||profile;prepared.bodyLog=Array.isArray(data.bodyLog)?data.bodyLog:[];prepared.checkins=data.checkins||{}}
  }else{
    prepared.legacyLoads=data.loads||legacyLoads;prepared.legacyDone=data.doneWeeks||legacyDone;prepared.customVideos=migrateKeyedObject(data.customVideos||customVideos);
  }
  return prepared;
}
async function importBackupFile(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const p=prepareImportedBackup(data); // valida tudo antes de apagar qualquer dado
    if(!confirm("Backup validado. Restaurar agora? Os dados atuais serão substituídos."))return;

    const oldSnapshot=allSessionRecords().map(x=>structuredClone(x));
    try{
      if(ULDB.db)await ULDB.clear("sessions");
      sessions={};
      for(const s of p.sessions){cacheSession(s);if(ULDB.db)await ULDB.put("sessions",s)}
      dayNotes=p.dayNotes;customVideos=p.customVideos;legacyLoads=p.legacyLoads;legacyDone=p.legacyDone;exOrder=p.exOrder;videoOk=p.videoOk;profile=p.profile;bodyLog=p.bodyLog;checkins=p.checkins;
      migrateOrder();savingLegacy();save();await saveV2();
      if(ULDB.db){for(const x of bodyLog)await ULDB.put("bodyEntries",x);for(const x of Object.values(checkins))await ULDB.put("checkins",x)}
      alert("Backup restaurado e validado.");render();
    }catch(writeErr){
      console.error("Falha durante restauração; tentando rollback",writeErr);
      if(ULDB.db){await ULDB.clear("sessions");for(const s of oldSnapshot)await ULDB.put("sessions",s)}
      sessions={};oldSnapshot.forEach(cacheSession);
      throw writeErr;
    }
  }catch(err){console.error(err);alert("Backup inválido, incompatível ou não pôde ser restaurado. Nenhum dado válido foi apagado.")}
}

  const a=el.dataset.action;
  if(a==="v2-nav"){active=null;viewDate=null;mainView=el.dataset.view;saveV2();render()}
  else if(a==="checkin"){const date=todayISO(),c=checkins[date]||{id:"checkin:"+date,schemaVersion:2,date,energy:0,sleep:0,motivation:0,createdAt:nowISO(),updatedAt:nowISO(),deletedAt:null};c[el.dataset.field]=Number(el.dataset.value);c.updatedAt=nowISO();checkins[date]=c;if(ULDB.db)ULDB.put("checkins",c).catch(err=>{storageHealth={ok:false,lastError:String(err?.message||err),lastWriteAt:storageHealth.lastWriteAt}});saveV2();renderDashboard()}
  else if(a==="cal-prev"){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderCalendar()}
  else if(a==="cal-next"){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderCalendar()}
  else if(a==="calendar-open"){active=el.dataset.day;viewDate=el.dataset.date;mainView="calendar";renderDay()}
  else if(a==="metric"){progressMetric=el.dataset.metric;renderProgress()}
  else if(a==="integrity-check"){showIntegrityCheck()}
  else if(a==="migration-report"){showMigrationReport()}
  else if(a==="cycle-progression-mode"){const modes=["conservative","balanced","push"];productPrefs.progressionMode=modes[(modes.indexOf(productPrefs.progressionMode)+1)%modes.length];saveProductPrefs();renderProfile()}
  else if(a==="toggle-why"){productPrefs.showWhy=!productPrefs.showWhy;saveProductPrefs();renderProfile()}
  else if(a==="open-warmup"){openWarmup(el.dataset.day,Number(el.dataset.idx))}
  else if(a==="delete-photo"){deleteBodyPhoto(el.dataset.id)}
  else if(a==="open-diagnostics"){active=null;mainView="diagnostics";saveV2();renderDiagnostics()}
  else if(a==="diag-storage-test"){storageSelfTest().then(()=>alert("Teste do IndexedDB concluído com sucesso.")).catch(err=>{console.error(err);alert("Falha no teste do IndexedDB: "+(err?.message||err))})}
  else if(a==="export-diagnostics"){exportDiagnostics()}
  else if(a==="diag-roundtrip"){showRoundTripTest()}
  else if(a==="recovery-save"){saveLocalRecoveryPoint().then(s=>{alert("Ponto de recuperação criado.");renderDiagnostics()}).catch(err=>{console.error(err);alert("Não foi possível criar o ponto de recuperação.")})}
  else if(a==="recovery-restore"){restoreLocalRecoveryPoint().then(ok=>{if(ok){alert("Ponto de recuperação restaurado.");renderDiagnostics()}}).catch(err=>{console.error(err);alert("Não foi possível restaurar: "+(err?.message||err))})}
  else if(a==="recovery-export"){exportRecoveryPoint()}
  else if(a==="body-save"){
    const val=id=>(document.getElementById(id)?.value||"").trim().replace(",",".");
    const date=val("body-date")||todayISO(),prev=bodyLog.find(x=>x.date===date),entry={id:prev?.id||uid("body"),schemaVersion:2,date,weight:val("body-weight"),waist:val("body-waist"),chest:val("body-chest"),arm:val("body-arm"),thigh:val("body-thigh"),createdAt:prev?.createdAt||nowISO(),updatedAt:nowISO(),deletedAt:null};
    if(![entry.weight,entry.waist,entry.chest,entry.arm,entry.thigh].some(Boolean)){alert("Preencha pelo menos uma medida.");return}
    const numeric=[["Peso",entry.weight],["Cintura",entry.waist],["Peito",entry.chest],["Braço",entry.arm],["Coxa",entry.thigh]];
    for(const [label,v] of numeric){if(v!==""&&!Number.isFinite(Number(v))){alert(label+" inválido.");return}if(v!==""&&Number(v)<=0){alert(label+" deve ser maior que zero.");return}}
    bodyLog=bodyLog.filter(x=>x.date!==entry.date);bodyLog.push(entry);bodyLog.sort((a,b)=>a.date>b.date?1:-1);if(ULDB.db)ULDB.put("bodyEntries",entry).catch(err=>{storageHealth={ok:false,lastError:String(err?.message||err),lastWriteAt:storageHealth.lastWriteAt}});saveV2();vibrate(25);renderProfile();
  }
  else if(a==="open-day"){active=el.dataset.day;viewDate=todayISO();mainView="workouts";saveV2();render()}
  else if(a==="back"){releaseWakeLock();active=null;viewDate=null;if(mainView!=="workouts")mainView="workouts";saveV2();render()}
  else if(a==="open-pending"){active="__videos";render()}
  else if(a==="toggle-set")toggleSet(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set));
  else if(a==="toggle-ex")toggleExercise(el.dataset.day,Number(el.dataset.idx));
  else if(a==="add-set")addSet(el.dataset.day,Number(el.dataset.idx));
  else if(a==="remove-set")removeSet(el.dataset.day,Number(el.dataset.idx));
  else if(a==="move-up")moveExercise(el.dataset.day,Number(el.dataset.idx),-1);
  else if(a==="move-down")moveExercise(el.dataset.day,Number(el.dataset.idx),1);
  else if(a==="reset-order")resetOrder();
  else if(a==="date-prev")shiftDate(-1);
  else if(a==="date-next")shiftDate(1);
  else if(a==="date-today"){viewDate=todayISO();renderDay()}
  else if(a==="set-video")setVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="confirm-video")confirmVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="unconfirm-video")unconfirmVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="clear-day")clearDay();
  else if(a==="timer-toggle")toggleTimerPanel();
  else if(a==="timer-start")startTimer(Number(el.dataset.seconds));
  else if(a==="timer-stop")stopTimer();
  else if(a==="open-calc")openPlateCalculator();
  else if(a==="close-calc")closePlateCalculator();
  else if(a==="calc-plates")computePlates();
  else if(a==="export-backup")exportBackup();
  else if(a==="export-migration-snapshot")exportMigrationSnapshot();
  else if(a==="import-backup")chooseBackup();
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.action==="ex-note")setExNote(el.dataset.day,Number(el.dataset.idx),el.value);
  else if(el.dataset.action==="day-note")setDayNote(el.dataset.day,el.value);
});
// carga/reps/RIR salvam ao sair do campo, para nao gravar valores parciais
document.addEventListener("change",ev=>{
  if(ev.target?.id==="body-photo-input"){
    const file=ev.target.files?.[0],owner=lastBody()?.id;
    addBodyPhoto(file,owner);
    ev.target.value="";
    return;
  }
  const el=ev.target;
  if(el.dataset.action==="set-field"){setField(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set),el.dataset.field,el.value);updateCard(el.dataset.day,Number(el.dataset.idx))}
  else if(el.dataset.action==="date-pick")setDate(el.value);
  else if(el.dataset.action==="profile-field"){profile[el.dataset.field]=el.dataset.field==="weeklyTarget"?Number(el.value):el.value;saveV2();}
});
document.addEventListener("focusout",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.action==="set-field")setField(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set),el.dataset.field,el.value);
});
document.addEventListener("change",ev=>{if(ev.target?.id==="import-file"){importBackupFile(ev.target.files?.[0]);ev.target.value=""}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSessionWrites()});
window.addEventListener("pagehide",()=>flushSessionWrites());

// Service worker: registrado apenas quando o app é servido por http(s) e o
// sw.js existe ao lado. Em file:// ou no HTML avulso sem sw.js, o register
// falha e é ignorado — o app segue funcionando pelo cache normal do navegador.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
document.getElementById("app").innerHTML=`<div class="wrap"><div class="v2page"><div class="v2card"><b>Preparando seus dados…</b><div class="v2muted" style="margin-top:6px">Migrando o histórico com segurança. Nada é apagado do armazenamento antigo.</div></div></div></div>`;initFoundation().then(()=>{render();restoreTimer()});
</script>
</body>
