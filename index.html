/**
 * Limites de sanidade para valores vindos de backup.
 * A interface já bloqueia negativos, reps > 100 e carga > 1000, mas a
 * importação não passa por ela: um arquivo editado à mão ou corrompido
 * entrava direto e envenenava o gráfico de volume em silêncio.
 * Aqui os valores fora da faixa são descartados e CONTADOS, para o usuário
 * saber o que aconteceu em vez de ver um número estranho meses depois.
 */
const IMPORT_LIMITS={load:{min:0,max:1000},reps:{min:0,max:100},rir:{min:0,max:10}};
function sanitizeImportedSets(sets,relatorio){
  if(!Array.isArray(sets))return[];
  return sets.map(x=>{
    const limpo={...x};
    for(const campo of ["load","reps","rir"]){
      const v=String(limpo[campo]??"").trim();
      if(v==="")continue;
      const n=Number(v.replace(",","."));
      const lim=IMPORT_LIMITS[campo];
      if(!Number.isFinite(n)||n<lim.min||n>lim.max){
        relatorio.push(`${campo}="${v}"`);
        limpo[campo]="";
      }
    }
    return limpo;
  });
}

function prepareImportedBackup(data){
  if(!data||typeof data!=="object")throw new Error("Formato inválido");
  const prepared={sessions:[],dayNotes:{},customVideos:{},legacyLoads:{},legacyDone:{},exOrder:{},videoOk:{},profile:profile,bodyLog:[],checkins:{},gyms:[],activeGymId:null,descartados:[]};
  if(data.version>=8&&Array.isArray(data.sessionRecords)){
    const backupExercises=new Map((Array.isArray(data.exercises)?data.exercises:[]).filter(Boolean).map(e=>[e.id,e]));
    for(const raw of data.sessionRecords){
      if(!raw?.date||!raw?.dayId||!raw?.exerciseId)throw new Error("Sessão incompleta no backup");
      const e=exerciseById(raw.exerciseId)||backupExercises.get(raw.exerciseId)||{series:Math.max(1,raw.sets?.length||3)};
      const limpo={...raw,sets:sanitizeImportedSets(raw.sets,prepared.descartados)};
      prepared.sessions.push(normalizeSession(limpo,{date:raw.date,dayId:raw.dayId,exerciseId:raw.exerciseId,series:e.series||Math.max(1,raw.sets?.length||3)}));
    }
    Object.assign(prepared,{dayNotes:data.dayNotes||{},customVideos:data.customVideos||{},legacyLoads:data.legacyLoads||{},legacyDone:data.legacyDone||{},exOrder:data.exOrder||{},videoOk:data.videoOk||{},profile:data.profile||profile,bodyLog:Array.isArray(data.bodyLog)?data.bodyLog:[]});
    (Array.isArray(data.checkins)?data.checkins:Object.values(data.checkins||{})).forEach(x=>{if(x?.date)prepared.checkins[x.date]=x});
  }else if(data.version>=5){
    for(const [date,byDay] of Object.entries(data.sessions||{}))for(const [day,byName] of Object.entries(byDay||{}))for(const [name,raw] of Object.entries(byName||{})){
      const eid=exerciseIdFromName(name)||name,e=exerciseById(eid);if(!e)continue;
      const limpo={...raw,sets:sanitizeImportedSets(raw.sets,prepared.descartados)};
      prepared.sessions.push(normalizeSession(limpo,{date,dayId:day,exerciseId:eid,series:e.series}));
    }
    prepared.dayNotes=data.dayNotes||{};prepared.customVideos=migrateKeyedObject(data.customVideos||{});prepared.legacyLoads=data.legacyLoads||{};prepared.legacyDone=data.legacyDone||{};prepared.exOrder=data.exOrder||{};prepared.videoOk=migrateKeyedObject(data.videoOk||{});
    if(data.version>=7){prepared.profile=data.profile||profile;prepared.bodyLog=Array.isArray(data.bodyLog)?data.bodyLog:[];prepared.checkins=data.checkins||{}}
  }else{
    prepared.legacyLoads=data.loads||legacyLoads;prepared.legacyDone=data.doneWeeks||legacyDone;prepared.customVideos=migrateKeyedObject(data.customVideos||customVideos);
  }
  // Vale para qualquer ramo acima: backups anteriores à v9 não trazem programa,
  // e nesse caso o programa atual é mantido em vez de ser zerado.
  if(data.version>=9){
    prepared.exercises=Array.isArray(data.exercises)?data.exercises:[];
    prepared.programs=Array.isArray(data.programs)?data.programs:[];
    prepared.activeProgramId=data.activeProgramId||null;
    prepared.dayPlans=Array.isArray(data.dayPlans)?data.dayPlans:[];
  }
  if(data.version>=10){prepared.gyms=Array.isArray(data.gyms)?data.gyms:[];prepared.activeGymId=data.activeGymId||null}
  return prepared;
}
async function importBackupFile(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const p=prepareImportedBackup(data); // valida tudo antes de apagar qualquer dado
    if(!confirm("Backup validado. Restaurar agora? Os dados atuais serão substituídos."))return;

    const oldSnapshot=allSessionRecords().map(x=>structuredClone(x));
    try{
      if(ULDB.db)await ULDB.clear("sessions");
      sessions={};
      for(const s of p.sessions){cacheSession(s);if(ULDB.db)await ULDB.put("sessions",s)}
      dayNotes=p.dayNotes;customVideos=p.customVideos;legacyLoads=p.legacyLoads;legacyDone=p.legacyDone;exOrder=p.exOrder;videoOk=p.videoOk;profile=p.profile;bodyLog=p.bodyLog;checkins=p.checkins;
      if(p.exercises){exerciseLibrary={};p.exercises.forEach(e=>{if(e&&e.id)exerciseLibrary[e.id]=e})}
      if(p.programs&&p.programs.length){programs=p.programs;activeProgramId=p.activeProgramId||programs[0]?.id||null}
      if(p.dayPlans){dayPlans={};p.dayPlans.forEach(x=>{if(x&&x.date&&x.dayId)dayPlans[planKey(x.date,x.dayId)]=x})}
      if(p.gyms){gyms=p.gyms;activeGymId=p.activeGymId||gyms.find(g=>!g.deletedAt)?.id||null}
      migrateOrder();savingLegacy();save();await saveV2();
      if(ULDB.db){
        for(const x of bodyLog)await ULDB.put("bodyEntries",x);for(const x of Object.values(checkins))await ULDB.put("checkins",x);
        if(p.exercises){await ULDB.clear("exercises");for(const x of p.exercises)await ULDB.put("exercises",x)}
        if(p.programs){await ULDB.clear("programs");for(const x of p.programs)await ULDB.put("programs",x);if(activeProgramId)await ULDB.setMeta("activeProgramId",activeProgramId)}
        if(p.dayPlans){await ULDB.clear("dayPlans");for(const x of p.dayPlans)await ULDB.put("dayPlans",x)}
        if(p.gyms){await ULDB.clear("gyms");for(const x of p.gyms)await ULDB.put("gyms",x);if(activeGymId)await ULDB.setMeta("activeGymId",activeGymId)}
      }
      const d=p.descartados||[];
      alert(d.length
        ? `Backup restaurado e validado.\n\n${d.length} valor(es) fora da faixa aceitável foram limpos por segurança (ex.: ${d.slice(0,3).join(", ")}). As séries continuam no histórico, apenas sem esses campos.`
        : "Backup restaurado e validado.");
      render();
    }catch(writeErr){
      console.error("Falha durante restauração; tentando rollback",writeErr);
      if(ULDB.db){await ULDB.clear("sessions");for(const s of oldSnapshot)await ULDB.put("sessions",s)}
      sessions={};oldSnapshot.forEach(cacheSession);
      throw writeErr;
    }
  }catch(err){console.error(err);alert("Backup inválido, incompatível ou não pôde ser restaurado. Nenhum dado válido foi apagado.")}
}

  else if(el.dataset.action==="day-note")setDayNote(el.dataset.day,el.value);

  // e o cursor pula a cada tecla.
  else if(el.dataset.action==="prog-rename"){
    const p=programs.find(x=>x.id===el.dataset.id);
    if(p){p.name=el.value;p.updatedAt=nowISO();if(ULDB.db)ULDB.put("programs",p)}
  }
  else if(el.dataset.action==="day-field"){
    const p=programs.find(x=>x.id===editingProgramId),d=p?.days.find(x=>x.id===editingDayId);
    if(!d)return;
    const f=el.dataset.field;
    d[f]=f==="weekday"?(el.value===""?null:Number(el.value)):el.value;
    p.updatedAt=nowISO();if(ULDB.db)ULDB.put("programs",p);
  }
  else if(el.dataset.action==="item-field"){
    const p=programs.find(x=>x.id===editingProgramId),d=p?.days.find(x=>x.id===editingDayId);
    const it=d?.items[Number(el.dataset.idx)];
    if(!it)return;
    const f=el.dataset.field;
    it[f]=(f==="series"||f==="descanso")?Math.max(1,Number(el.value)||1):el.value;
    p.updatedAt=nowISO();if(ULDB.db)ULDB.put("programs",p);
  }
  else if(el.dataset.action==="lib-search"){
    libraryQuery=el.value;

document.addEventListener("change",ev=>{if(ev.target?.id==="import-file"){importBackupFile(ev.target.files?.[0]);ev.target.value=""}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSessionWrites()});
window.addEventListener("pagehide",()=>flushSessionWrites());

// Service worker: registrado apenas quando o app é servido por http(s) e o
// sw.js existe ao lado. Em file:// ou no HTML avulso sem sw.js, o register
// falha e é ignorado — o app segue funcionando pelo cache normal do navegador.
/**
 * Informa ao service worker quais mídias podem ficar em cache offline.
 * Só entram as que passam em mediaCacheAllowed(): licença resolvida para uso
 * comercial E permissão explícita de offline. Guardar mídia de terceiro em
 * cache é uma forma de distribuição — o padrão é não guardar.
 */
function publishMediaCachePolicy(){
  if(!navigator.serviceWorker?.controller)return;
  const urls=Object.values(exerciseLibrary||{})
    .filter(e=>e&&!e.deletedAt&&mediaCacheAllowed(e))
    .flatMap(e=>[e.media?.videoUrl,e.media?.animationUrl,e.media?.thumbnailUrl])
    .filter(Boolean);
  navigator.serviceWorker.controller.postMessage({type:"media-cache-allow",urls});
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(()=>{setTimeout(publishMediaCachePolicy,0)}).catch(()=>{});
  });
}
document.getElementById("app").innerHTML=`<div class="wrap"><div class="v2page"><div class="v2card"><b>Preparando seus dados…</b><div class="v2muted" style="margin-top:6px">Migrando o histórico com segurança. Nada é apagado do armazenamento antigo.</div></div></div></div>`;initFoundation().then(()=>{render();restoreTimer()});
</script>
