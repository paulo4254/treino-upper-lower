/* ===== ajustes v3 ===== */
.datebar{display:flex;align-items:center;gap:8px;margin-top:12px}
.datebar input[type=date]{flex:1;min-width:0;background:#14161A;border:1px solid #2A2D33;border-radius:10px;padding:8px 10px;color:#F2F0EA;font-size:13px;outline:none}
.datebar input[type=date]:focus{border-color:#D4A72C55}
.datenav{border:1px solid #33373e;background:#1D2025;color:#9A9DA3;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:800;line-height:1}
.todaybtn{border:1px solid #D4A72C55;background:transparent;color:#D4A72C;border-radius:10px;padding:8px 11px;font-size:11.5px;font-weight:800}
.pastwarn{margin:12px 20px 0;padding:10px 13px;border-radius:11px;background:#5B5FE915;border:1px solid #5B5FE955;color:#9FA2F0;font-size:11.5px;line-height:1.45}

.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.movebox{display:flex;gap:4px;flex-shrink:0}
.movebtn{border:1px solid #2A2D33;background:#14161A;color:#82868D;border-radius:8px;width:28px;height:26px;font-size:12px;line-height:1;padding:0}
.movebtn:disabled{opacity:.3}
.movebtn:active{border-color:#D4A72C}

.setextra{display:flex;gap:8px;margin-top:8px}
.setextra button{flex:1;border:1px dashed #33373e;background:transparent;color:#82868D;border-radius:9px;padding:7px;font-size:11px;font-weight:700}
.setextra button:active{border-color:#D4A72C;color:#D4A72C}
.setrow.bonus .setlabel{color:#D4A72C}

/* modal calculadora */
.modal-overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#1D2025;border:1px solid #33373e;border-radius:18px;width:100%;max-width:340px;padding:20px;box-shadow:0 14px 40px #000c}
.modal-title{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:0;color:#9A9DA3;font-size:22px;line-height:1;padding:0 4px}
.modal-field{margin-bottom:12px}
.modal-field label{font-size:11px;color:#82868D;display:block;margin-bottom:5px}
.modal-input{width:100%;background:#14161A;border:1px solid #2A2D33;border-radius:10px;padding:10px;color:#F2F0EA;font-size:15px;outline:none}
.modal-input:focus{border-color:#D4A72C55}
.plate-result{background:#14161A;border:1px solid #2A2D33;border-radius:10px;padding:12px;font-size:13px;margin-top:14px;color:#D4A72C;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}
.plate-result.err{color:#E8542A}
.plate-result small{color:#82868D;font-size:11px}

/* tela de videos pendentes */
.vidlist{padding:16px 20px 40px;display:flex;flex-direction:column;gap:10px}
.vidcard{background:#1D2025;border:1px solid #2A2D33;border-radius:14px;padding:14px}
.vidcard .vday{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800}
.vidcard .vname{font-size:15px;font-weight:750;margin-top:3px}
.vidcard .vgrp{font-size:11.5px;color:#82868D;margin-top:2px}
.vidactions{display:flex;gap:8px;margin-top:11px}
.vidactions button,.vidactions a{flex:1;text-align:center;border-radius:9px;padding:9px;font-size:11.5px;font-weight:700;text-decoration:none;border:1px solid #33373e;background:#14161A;color:#F2F0EA}
.vidactions .searchlink{border-color:#3A3D43;color:#9A9DA3}
.vsection{margin:20px 20px 0;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#82868D}
.vsection+.vidlist{padding-top:10px}
.vidcard .vsrc{font-size:11px;color:#6E727A;margin-top:5px;line-height:1.4}
.vidconfirm{width:100%;margin-top:8px;border:1px solid #D4A72C55;background:transparent;color:#D4A72C;border-radius:9px;padding:9px;font-size:11.5px;font-weight:700}
.vidconfirm.done{border-color:#5FBF7A55;color:#5FBF7A}
.vidempty{margin:20px;padding:22px;text-align:center;border:1px dashed #2A2D33;border-radius:14px;color:#82868D;font-size:13px;line-height:1.5}

/* ===== UL TREINO 2.0 ===== */
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.v2page{padding:18px 20px 110px}
.v2hero{
  padding:22px 20px 14px;
  display:flex;justify-content:space-between;gap:14px;align-items:flex-start
}
.v2eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#D4A72C;font-weight:800}
.v2hero h1{font-size:28px;line-height:1.05;margin:5px 0 5px;letter-spacing:-.6px}
.v2muted{color:#8C9097;font-size:12px;line-height:1.45}
.v2badge{font-size:10px;color:#D4A72C;border:1px solid #D4A72C55;background:#D4A72C10;border-radius:999px;padding:5px 9px;font-weight:800;white-space:nowrap}
.v2grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.v2stat{background:#1D2025;border:1px solid #2A2D33;border-radius:14px;padding:14px;min-height:92px}
.v2stat b{display:block;font-size:23px;letter-spacing:-.5px}
.v2stat span{display:block;color:#858990;font-size:10.5px;margin-top:3px;line-height:1.35}
.v2section{margin-top:16px}
.v2section-title{font-size:12px;font-weight:850;letter-spacing:.2px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.v2section-title small{font-size:10px;color:#777B82;font-weight:600}
.v2card{background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:15px}

  width:100%;border:0;border-radius:12px;padding:12px 14px;background:#D4A72C;color:#14161A;
  font-size:13px;font-weight:850;cursor:pointer
}
.v2secondary{
  width:100%;border:1px solid #34383F;border-radius:11px;padding:10px 12px;background:#16191D;color:#F2F0EA;
  font-size:12px;font-weight:750;cursor:pointer
}
.v2row{display:flex;gap:8px;align-items:center}
.v2row>*{min-width:0}
.v2next{display:flex;justify-content:space-between;align-items:center;gap:12px}
.v2next .name{font-size:18px;font-weight:850}
.v2next .meta{color:#888C93;font-size:11px;margin-top:3px}
.v2pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#14161A;border:1px solid #30343A;color:#AEB1B7}
.readiness{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.readybtn{border:1px solid #31353B;background:#15181C;color:#A0A4AB;border-radius:10px;padding:10px 5px;font-size:11px;font-weight:750}
.readybtn.on{border-color:#D4A72C;background:#D4A72C16;color:#D4A72C}
.mini-note{margin-top:8px;font-size:10px;color:#73777E;line-height:1.45}
.v2form{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.v2field{display:flex;flex-direction:column;gap:5px}
.v2field.full{grid-column:1/-1}
.v2field label{font-size:10px;color:#80848B}
.v2input,.v2select{
  width:100%;background:#14161A;border:1px solid #2D3036;border-radius:10px;padding:10px;color:#F2F0EA;outline:none;font-size:13px
}
.v2input:focus,.v2select:focus{border-color:#D4A72C66}
.v2tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.v2tab{border:1px solid #2D3036;background:#171A1E;color:#8D9198;border-radius:999px;padding:7px 10px;font-size:10.5px;font-weight:750;white-space:nowrap}

.v2chart{margin-top:10px;background:#15181C;border:1px solid #292D32;border-radius:12px;padding:10px}
.v2chart svg{width:100%;height:130px;display:block}
.v2chart-foot{display:flex;justify-content:space-between;color:#696E75;font-size:9.5px;margin-top:4px}
.v2empty{padding:20px 10px;text-align:center;color:#777B82;font-size:12px;line-height:1.5}
.prlist{display:flex;flex-direction:column;gap:7px}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

/* Rotação em torno da articulação, em coordenadas do viewBox.
   view-box (e não fill-box) mantém o pivô fixo mesmo que o grupo ganhe
   elementos novos — o halter aninhado, por exemplo. */
@keyframes demoPressArm{0%,100%{transform:rotate(15deg)}48%,55%{transform:rotate(-27deg)}}
@keyframes demoPressFore{0%,100%{transform:rotate(-72deg)}48%,55%{transform:rotate(-18deg)}}
@keyframes demoPulseMuscle{0%,100%{opacity:.65}50%{opacity:1}}
.demo-upperarm{transform-box:view-box;transform-origin:236px 199px;animation:demoPressArm 2.25s ease-in-out infinite}
.demo-forearm{transform-box:view-box;transform-origin:278px 224px;animation:demoPressFore 2.25s ease-in-out infinite}
.demo-muscle{animation:demoPulseMuscle 2.25s ease-in-out infinite}

/* ===== iOS: evitar o zoom automático ao focar campos =====
 * O Safari do iPhone aplica zoom em qualquer campo com fonte < 16px. Na prática
 * a tela salta quando você toca no campo de carga entre séries, e é preciso
 * pinçar de volta com a mão suada. 16px é o mínimo que impede isso.
 * Não usamos maximum-scale=1 para resolver: aquilo desativa o zoom do usuário
 * e quebra a acessibilidade de quem precisa ampliar. */
@supports (-webkit-touch-callout: none){
  input,select,textarea,.field,.v2input,.v2select,.note,.daynote textarea{font-size:16px}
  /* compensa a fonte maior nos campos estreitos da linha de série */
  .setrow .field{padding:9px 4px;letter-spacing:-.3px}
}

const dirtySessions=new Map();
let dirtyTimer=null;

function queueSessionWrite(s){
  if(!s?.id)return;
  dirtySessions.set(s.id,s);
  if(dirtyTimer)clearTimeout(dirtyTimer);
  dirtyTimer=setTimeout(()=>flushSessionWrites(),180);
}
async function flushSessionWrites(){
  if(dirtyTimer){clearTimeout(dirtyTimer);dirtyTimer=null}
  if(!ULDB.db||!dirtySessions.size)return;
  const batch=[...dirtySessions.values()];
  dirtySessions.clear();
  try{
    for(const s of batch)await ULDB.put("sessions",s);
    storageHealth={ok:true,lastError:"",lastWriteAt:nowISO()};
  }catch(err){
    batch.forEach(s=>dirtySessions.set(s.id,s));
    storageHealth={ok:false,lastError:String(err?.message||err),lastWriteAt:storageHealth.lastWriteAt};
    console.error("Falha ao salvar no IndexedDB",err);
  }
}

const ULDB={name:"ul-treino-db",version:3,db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open(this.name,this.version);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("sessions")){const s=db.createObjectStore("sessions",{keyPath:"id"});s.createIndex("date","date");s.createIndex("exerciseId","exerciseId");s.createIndex("updatedAt","updatedAt")}if(!db.objectStoreNames.contains("bodyEntries")){const s=db.createObjectStore("bodyEntries",{keyPath:"id"});s.createIndex("date","date")}if(!db.objectStoreNames.contains("checkins")){const s=db.createObjectStore("checkins",{keyPath:"id"});s.createIndex("date","date",{unique:true})}if(!db.objectStoreNames.contains("media")){const s=db.createObjectStore("media",{keyPath:"id"});s.createIndex("ownerId","ownerId")}if(!db.objectStoreNames.contains("exercises")){const s=db.createObjectStore("exercises",{keyPath:"id"});s.createIndex("group","group");s.createIndex("updatedAt","updatedAt")}if(!db.objectStoreNames.contains("programs")){const s=db.createObjectStore("programs",{keyPath:"id"});s.createIndex("updatedAt","updatedAt")}if(!db.objectStoreNames.contains("dayPlans")){const s=db.createObjectStore("dayPlans",{keyPath:"id"});s.createIndex("date","date")}if(!db.objectStoreNames.contains("gyms")){const s=db.createObjectStore("gyms",{keyPath:"id"});s.createIndex("updatedAt","updatedAt")}if(!db.objectStoreNames.contains("meta"))db.createObjectStore("meta",{keyPath:"key"})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},store(n,m="readonly"){return this.db.transaction(n,m).objectStore(n)},all(n){return new Promise((res,rej)=>{const r=this.store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},put(n,v){return new Promise((res,rej)=>{const r=this.store(n,"readwrite").put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)})},clear(n){return new Promise((res,rej)=>{const r=this.store(n,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},meta(k){return new Promise((res,rej)=>{const r=this.store("meta").get(k);r.onsuccess=()=>res(r.result?.value);r.onerror=()=>rej(r.error)})},setMeta(k,v){return this.put("meta",{key:k,value:v,updatedAt:nowISO()})}};

function cloneSet(x={}){return{id:x.id||uid("set"),load:x.load??"",reps:x.reps??"",rir:x.rir??"",done:!!x.done,createdAt:x.createdAt||nowISO(),updatedAt:x.updatedAt||nowISO(),deletedAt:x.deletedAt||null}}
function normalizeSession(raw,{date,dayId,exerciseId,series}){const stamp=raw.updatedAt||raw.createdAt||nowISO(),sets=(Array.isArray(raw.sets)?raw.sets:[]).map(cloneSet);while(sets.length<series)sets.push(cloneSet());return{id:raw.id||sessionId(date,dayId,exerciseId),schemaVersion:2,date,dayId,exerciseId,sets,note:raw.note||"",extra:Number(raw.extra||0),createdAt:raw.createdAt||stamp,updatedAt:stamp,deletedAt:raw.deletedAt||null}}
function cacheSession(s){if(!sessions[s.date])sessions[s.date]={};if(!sessions[s.date][s.dayId])sessions[s.date][s.dayId]={};sessions[s.date][s.dayId][s.exerciseId]=s}
function allSessionRecords(){const a=[];Object.values(sessions).forEach(d=>Object.values(d||{}).forEach(e=>Object.values(e||{}).forEach(s=>{if(s&&!s.deletedAt)a.push(s)})));return a}
function touchSession(s){s.updatedAt=nowISO();s.schemaVersion=2;s.sets.forEach(x=>{if(!x.id)x.id=uid("set");if(!x.createdAt)x.createdAt=s.createdAt||s.updatedAt;if(!x.updatedAt)x.updatedAt=s.updatedAt;if(x.deletedAt===undefined)x.deletedAt=null});queueSessionWrite(s)}
async function persistAllSessions(){if(ULDB.db)await Promise.all(allSessionRecords().map(s=>ULDB.put("sessions",s)))}
function migrateKeyedObject(obj){const out={};Object.entries(obj||{}).forEach(([k,v])=>{const p=k.indexOf("|");if(p<0){out[k]=v;return}const day=k.slice(0,p),old=k.slice(p+1),eid=exerciseIdFromName(old)||old;out[stableKey(day,eid)]=v});return out}
function migrateOrder(){const next={};Object.entries(exOrder||{}).forEach(([day,arr])=>{const d=DIAS.find(x=>x.id===day);if(!d||!Array.isArray(arr))return;next[day]=arr.map(v=>d.exercicios.find(e=>e.exerciseId===v)?.exerciseId||d.exercicios.find(e=>e.nome===v)?.exerciseId).filter(Boolean)});exOrder=next}
async function migrateLegacySessions(){for(const [date,byDay] of Object.entries(LEGACY_SESSION_SNAPSHOT||{})){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;for(const [day,byName] of Object.entries(byDay||{})){for(const [name,raw] of Object.entries(byName||{})){const eid=exerciseIdFromName(name),e=exerciseById(eid);if(!eid||!e)continue;const s=normalizeSession(raw||{},{date,dayId:day,exerciseId:eid,series:e.series});cacheSession(s);await ULDB.put("sessions",s)}}}}
async function migrateBodyCheckins(){for(const x of safeGet("ul-v2-body-log",[])){await ULDB.put("bodyEntries",{...x,id:x.id||uid("body"),schemaVersion:2,createdAt:x.createdAt||nowISO(),updatedAt:x.updatedAt||nowISO(),deletedAt:x.deletedAt||null})}for(const [date,x] of Object.entries(safeGet("ul-v2-checkins",{}))){await ULDB.put("checkins",{...x,id:x.id||"checkin:"+date,schemaVersion:2,date,createdAt:x.createdAt||nowISO(),updatedAt:x.updatedAt||nowISO(),deletedAt:x.deletedAt||null})}}

async function resizePhotoFile(file,maxSide=1600,quality=.82){
  if(!file||!file.type?.startsWith("image/"))throw new Error("Arquivo não é uma imagem.");
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});ctx.drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();
  const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error("Falha ao comprimir imagem.")),"image/jpeg",quality));
  return{blob,width:w,height:h,type:"image/jpeg",bytes:blob.size};
}
async function storeBodyPhoto(file,bodyEntryId){
  if(!ULDB.db)throw new Error("Banco local indisponível.");
  const img=await resizePhotoFile(file);
  const rec={id:uid("media"),schemaVersion:2,ownerId:bodyEntryId,kind:"body-photo",blob:img.blob,width:img.width,height:img.height,type:img.type,bytes:img.bytes,createdAt:nowISO(),updatedAt:nowISO(),deletedAt:null};
  await ULDB.put("media",rec);
  return rec;
}

/* ===== Biblioteca, programas e planos do dia =====
 *
 * PROBLEMA QUE ESTE MÓDULO RESOLVE
 *
 * Antes, o histórico era lido *através* do programa atual: funções como
 * workoutProgressOn percorriam DIAS e buscavam sessão para cada exercício.
 * Consequência medida: ao trocar um exercício do programa, o PR dele sumia e
 * um treino antigo passava a exibir 0 séries em vez de 1. Mudar o programa
 * reescrevia o passado.
 *
 * SEPARAÇÃO ADOTADA
 *
 *   exercises  identidade do movimento. Nunca é apagada de verdade
 *              (soft-delete), porque o histórico aponta para ela.
 *   programs   o que fazer. Muda quando você quiser, sem afetar o passado.
 *   dayPlans   fotografia do que o programa mandava fazer NAQUELE dia.
 *              É o que permite dizer "em 06/07 o treino tinha 8 exercícios"
 *              mesmo que hoje tenha 6.
 *   sessions   o que aconteceu. Aponta para exerciseId.
 *
 * REGRA GERAL: o passado se lê a partir de sessions + dayPlans. O programa
 * responde apenas "o que faço hoje".
 */

/* ---------- biblioteca de exercícios ---------- */

/* Taxonomia interna: deixa a biblioteca consistente mesmo quando o exercício
 * foi criado pelo usuário com poucos campos. É deliberadamente simples e
 * transparente: serve para busca/substituição, não para "prescrever" treino. */
const MOVEMENT_PATTERNS=[
  "empurrar horizontal","empurrar vertical","puxar horizontal","puxar vertical",
  "agachamento","extensão de joelho","flexão de joelho","hinge de quadril",
  "extensão de quadril","abdução de ombro","extensão de cotovelo","flexão de cotovelo",
  "panturrilha","core","isolamento"
];
const EXERCISE_DIFFICULTIES=["iniciante","intermediário","avançado"];
const EXERCISE_MECHANICS=["composto","isolador"];
const MEDIA_LICENSE_TYPES=["desconhecida","própria","licenciada","externa"];
function normalizeMedia(x={}){
  const m=x.media||{};
  return{
    videoUrl:m.videoUrl||x.video||"",
    animationUrl:m.animationUrl||x.animationUrl||"",
    thumbnailUrl:m.thumbnailUrl||x.thumbnailUrl||"",
    provider:m.provider||x.mediaProvider||"",
    licenseType:m.licenseType||x.mediaLicenseType||"desconhecida",
    licenseRef:m.licenseRef||x.mediaLicenseRef||"",
    commercialUseApproved:!!(m.commercialUseApproved??x.commercialUseApproved),
    offlineEligible:!!(m.offlineEligible??x.offlineEligible),
    updatedAt:m.updatedAt||x.updatedAt||nowISO()
  };
}
function deriveMechanics(x={}){
  if(EXERCISE_MECHANICS.includes(x.mechanics))return x.mechanics;
  const p=deriveMovementPattern(x);
  return ["isolamento","abdução de ombro","extensão de joelho","flexão de joelho","extensão de cotovelo","flexão de cotovelo","panturrilha"].includes(p)?"isolador":"composto";
}
function mediaReadiness(e={}){
  const m=e.media||normalizeMedia(e);
  if(m.animationUrl&&m.commercialUseApproved)return "animation";
  if(m.videoUrl)return "video";
  return "none";
}
function mediaReadinessLabel(e={}){
  const r=mediaReadiness(e);return r==="animation"?"Animação pronta":r==="video"?"Vídeo":"Sem mídia";
}
/* ===== Auditoria de licença de mídia =====
 *
 * Os campos de licença existiam desde a 4.1, mas nada os verificava: eram
 * decorativos, como o loadType foi entre a 3.0 e a 3.2. O risco aqui é
 * concreto — publicar o app com animação ou vídeo de terceiro sem direito de
 * distribuição. A Apple pede declaração de direitos sobre o conteúdo, e o
 * problema aparece na revisão, não antes.
 *
 * Regra: mídia de fornecedor externo só é considerada liberada se tiver
 * fornecedor identificado, tipo de licença, referência do contrato E aprovação
 * explícita de uso comercial. Mídia própria (`own`) e domínio público
 * (`public-domain`) não precisam de contrato.
 */

const LICENCAS_SEM_CONTRATO=["own","public-domain","cc0"];

/**
 * Distingue LINK de MÍDIA DISTRIBUÍDA — a diferença que importa juridicamente.
 *
 * Abrir o YouTube num link externo não é distribuir conteúdo: o app só aponta
 * para onde a obra já está publicada pelo próprio detentor. Já embutir ou
 * guardar em cache um arquivo de vídeo/animação é distribuição, e aí a licença
 * é necessária.
 *
 * Sem essa distinção a auditoria marcava os 28 exercícios do catálogo como
 * bloqueados, só porque têm link de YouTube — um alarme falso que ensinaria a
 * ignorar o aviso, que é o pior resultado possível para um aviso.
 */
function isDistributedMediaUrl(url){
  if(!url)return false;
  const u=String(url).trim();
  if(/^(data|blob):/i.test(u))return true;                 // embutido no app
  if(/\.(mp4|webm|mov|m4v|gif|glb|gltf|png|jpe?g|webp)(\?|#|$)/i.test(u))return true;
  return false;                                            // página externa = link
}

function mediaLicenseStatus(e={}){
  const m=e.media||{};
  const candidatos=[m.videoUrl,m.animationUrl,m.thumbnailUrl,e.video].filter(Boolean);
  const distribuidas=candidatos.filter(isDistributedMediaUrl);
  if(!candidatos.length)return{status:"none",motivo:"sem mídia"};
  if(!distribuidas.length)return{status:"link",motivo:"apenas link externo, sem distribuição"};

  const tipo=String(m.licenseType||"").trim();
  if(LICENCAS_SEM_CONTRATO.includes(tipo))return{status:"ok",motivo:"mídia própria ou livre"};

  const faltando=[];
  if(!tipo)faltando.push("tipo de licença");
  if(!String(m.provider||"").trim())faltando.push("fornecedor");
  if(!String(m.licenseRef||"").trim())faltando.push("referência do contrato");
  if(!m.commercialUseApproved)faltando.push("aprovação de uso comercial");

  if(!faltando.length)return{status:"ok",motivo:"licenciada e aprovada"};
  return{status:m.commercialUseApproved?"incompleta":"bloqueada",motivo:"falta "+faltando.join(", "),faltando};
}

/**
 * Panorama para a tela de Diagnóstico e para a decisão de publicar.
 * `bloqueados` é a lista que impede distribuição comercial hoje.
 */
function licenseAudit(){
  const itens=Object.values(exerciseLibrary||{}).filter(e=>e&&!e.deletedAt);
  const detalhe=itens.map(e=>({id:e.id,name:e.name,...mediaLicenseStatus(e)}));
  const bloqueados=detalhe.filter(x=>x.status==="bloqueada");
  const incompletos=detalhe.filter(x=>x.status==="incompleta");
  const liberados=detalhe.filter(x=>x.status==="ok");
  const semMidia=detalhe.filter(x=>x.status==="none");
  const apenasLink=detalhe.filter(x=>x.status==="link");
  return{
    total:itens.length,comMidia:itens.length-semMidia.length-apenasLink.length,
    apenasLink:apenasLink.length,
    liberados:liberados.length,incompletos:incompletos.length,bloqueados:bloqueados.length,
    prontoParaDistribuir:bloqueados.length===0&&incompletos.length===0,
    listaBloqueados:bloqueados,listaIncompletos:incompletos
  };
}

/** Mídia que pode ser guardada offline: exige licença resolvida E permissão. */
function mediaCacheAllowed(e={}){
  const m=e.media||{};
  return mediaLicenseStatus(e).status==="ok"&&!!m.offlineEligible;
}

function normText(v){return String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function deriveMovementPattern(x={}){
  if(x.movementPattern)return x.movementPattern;
  const n=normText((x.name||x.nome||"")+" "+(x.group||x.grupo||""));
  if(/supino|chest press|voador|crucifixo|crossover/.test(n))return "empurrar horizontal";
  if(/desenvolvimento|shoulder press/.test(n))return "empurrar vertical";
  if(/remada/.test(n))return "puxar horizontal";
  if(/puxada|pulldown|barra fixa/.test(n))return "puxar vertical";
  if(/hack|agach|pendulo|leg press/.test(n))return "agachamento";
  if(/extensora/.test(n))return "extensão de joelho";
  if(/flexora|leg curl/.test(n))return "flexão de joelho";
  if(/stiff|romeno|rdl|terra/.test(n))return "hinge de quadril";
  if(/elevacao pelv|hip thrust/.test(n))return "extensão de quadril";
  if(/elevacao lateral/.test(n))return "abdução de ombro";
  if(/triceps/.test(n))return "extensão de cotovelo";
  if(/rosca|biceps/.test(n))return "flexão de cotovelo";
  if(/panturr/.test(n))return "panturrilha";
  if(/abdom|crunch|prancha|core/.test(n))return "core";
  return "isolamento";
}
function equipmentFamily(v){
  const n=normText(v);
  if(!n)return "livre/geral";
  if(/halter/.test(n))return "halteres";
  if(/barra|smith/.test(n))return "barra/smith";
  if(/polia|cabo|crossover/.test(n))return "cabos";
  if(/maquina|machine|hack|pendulo|leg press|extensora|flexora|pec deck|voador/.test(n))return "máquina";
  if(/peso corporal|barra fixa/.test(n))return "peso corporal";
  return n;
}
function sameMuscle(a,b){return !!a&&!!b&&normText(a)===normText(b)}
function overlapSecondary(a=[],b=[]){const aa=new Set(a.map(normText));return b.map(normText).filter(x=>aa.has(x)).length}

function exerciseRecord(x={}){
  const media=normalizeMedia(x);
  return{
    id:x.id||uid("ex"),
    schemaVersion:6,
    name:x.name||"",
    group:x.group||"",
    equipment:x.equipment||"",
    loadType:x.loadType||"total",

    difficulty:EXERCISE_DIFFICULTIES.includes(x.difficulty)?x.difficulty:"intermediário",
    mechanics:deriveMechanics(x),
    tags:Array.isArray(x.tags)?x.tags:[],
    unilateral:!!x.unilateral,
    alternatives:Array.isArray(x.alternatives)?x.alternatives:[],
    favorite:!!x.favorite,
    media,
    // compatibilidade com versões anteriores: telas antigas ainda podem ler video.
    video:media.videoUrl,

    alternateVideoLabel:x.alternateVideoLabel||x.videoAltLabel||"Vídeo alternativo",
    videoStatus:x.videoStatus||(media.videoUrl?"reference":"pending"),
    tip:x.tip||"",

    custom:!!x.custom,

function libraryList({includeDeleted=false,query="",group="",gymOnly=false,pattern="",equipment="",favoritesOnly=false,media="",sort="name"}={}){
  const q=normText(query);
  const rows=Object.values(exerciseLibrary)
    .filter(e=>includeDeleted||!e.deletedAt)
    .filter(e=>!group||e.group===group)
    .filter(e=>!pattern||e.movementPattern===pattern)
    .filter(e=>!equipment||e.equipmentFamily===equipment)
    .filter(e=>!favoritesOnly||e.favorite)
    .filter(e=>!media||mediaReadiness(e)===media)
    .filter(e=>!gymOnly||exerciseAvailableAtActiveGym(e))
    .filter(e=>{
      if(!q)return true;
      const hay=[e.name,e.group,e.equipment,e.movementPattern,e.mechanics,e.difficulty,...(e.aliases||[]),...(e.secondaryGroups||[]),...(e.tags||[])].map(normText).join(" ");
      return hay.includes(q);
    });
  return rows.sort((a,b)=>{
    if(sort==="favorites"&&a.favorite!==b.favorite)return a.favorite?-1:1;
    if(sort==="muscle")return (a.group||"").localeCompare(b.group||"","pt-BR")||a.name.localeCompare(b.name,"pt-BR");
    return a.name.localeCompare(b.name,"pt-BR");
  });
}

function exerciseEquipmentFamilies(){return [...new Set(Object.values(exerciseLibrary).filter(e=>!e.deletedAt).map(e=>e.equipmentFamily).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"))}

/* ---------- planos do dia (fotografia do programa) ---------- */

/**
 * Devolve o plano vigente para uma data. Se já existe fotografia, ela manda —
 * é isso que impede uma edição de hoje de alterar o que o app mostra sobre
 * um treino de semanas atrás.
 */
/**
 * Plano reconstruído a partir do que foi REGISTRADO naquele dia.
 * Rede de segurança para sessões sem plano congelado — histórico migrado de
 * versões antigas, backups de terceiros, ou dias excluídos do programa depois.
 * Sem isso, um treino antigo passava a exibir 0 exercícios quando o dia saía
 * do programa, embora o volume continuasse contando: o app se contradizia.
 */
function planFromSessions(date,dayId){
  const porExercicio=sessions?.[date]?.[dayId];
  if(!porExercicio)return null;
  const items=Object.values(porExercicio)
    .filter(s=>s&&!s.deletedAt&&Array.isArray(s.sets))
    .map(s=>programItem({
      exerciseId:s.exerciseId,
      series:Math.max(1,s.sets.filter(x=>!x.deletedAt).length),
      reps:"",rir:"",descanso:90
    }));
  if(!items.length)return null;
  return{id:"plan:"+date+":"+dayId,date,dayId,programId:null,
         label:"Treino registrado",foco:"",cor:"#8A9099",items,frozen:false,reconstruido:true};
}

function planForDate(date,dayId){
  const congelado=dayPlans[planKey(date,dayId)];
  if(congelado&&!congelado.deletedAt)return congelado;
  const d=programDayById(dayId);
  if(d)return{id:"plan:"+date+":"+dayId,date,dayId,programId:activeProgram()?.id||null,
         label:d.label,foco:d.foco,cor:d.cor,items:d.items.map(programItem),frozen:false};
  // O dia não existe mais no programa: reconstrói pelo registro, para não
  // perder de vista um treino que realmente aconteceu.
  return planFromSessions(date,dayId);
}
/**
 * Congela o plano do dia. Chamado quando a primeira série é registrada:
 * a partir daí, aquele treino tem uma composição própria e imutável.
 */
async function freezeDayPlan(date,dayId){
  const k=planKey(date,dayId);
  if(dayPlans[k])return dayPlans[k];
  const base=planForDate(date,dayId);
  if(!base)return null;
  const rec={...base,id:"plan:"+date+":"+dayId,schemaVersion:4,frozen:true,
             createdAt:nowISO(),updatedAt:nowISO(),deletedAt:null};
  dayPlans[k]=rec;
  if(ULDB.db)await ULDB.put("dayPlans",rec);
  return rec;
}
/** Exercícios de um dia, na ordem do plano vigente para aquela data. */
function planItems(date,dayId){
  return planForDate(date,dayId)?.items||[];
}

function activeGym(){return gyms.find(g=>g.id===activeGymId&&!g.deletedAt)||gyms.find(g=>!g.deletedAt)||null}
function normEquipment(v){return String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function exerciseAvailableAtActiveGym(e){

}

/* ---------- troca de exercício só para a sessão/data ---------- */
function workoutDayAt(date,dayId){return historicalDay(date,dayId)}
async function replaceExerciseForDate(date,dayId,fromExerciseId,toExerciseId){
  if(!toExerciseId||fromExerciseId===toExerciseId)return null;
  const plan=await freezeDayPlan(date,dayId);if(!plan)return null;
  const idx=plan.items.findIndex(it=>it.exerciseId===fromExerciseId);if(idx<0)return null;
  const old=plan.items[idx];plan.items[idx]=programItem({...old,exerciseId:toExerciseId});
  plan.updatedAt=nowISO();dayPlans[planKey(date,dayId)]=plan;if(ULDB.db)await ULDB.put("dayPlans",plan);return plan;
}
function swapScore(current,candidate){
  let score=0;const reasons=[];
  if((current.alternatives||[]).includes(candidate.id)){score+=100;reasons.push("alternativa cadastrada")}
  if(sameMuscle(current.group,candidate.group)){score+=48;reasons.push("mesmo músculo principal")}
  if(current.movementPattern&&candidate.movementPattern&&normText(current.movementPattern)===normText(candidate.movementPattern)){score+=38;reasons.push("mesmo padrão de movimento")}
  const sec=overlapSecondary(current.secondaryGroups||[],candidate.secondaryGroups||[]);if(sec){score+=Math.min(12,sec*4);reasons.push("músculos secundários semelhantes")}
  if(current.mechanics&&candidate.mechanics&&current.mechanics===candidate.mechanics){score+=6;reasons.push("mesma mecânica")}
  if(current.equipmentFamily&&candidate.equipmentFamily&&current.equipmentFamily===candidate.equipmentFamily){score+=7;reasons.push("equipamento semelhante")}
  if(current.loadType&&candidate.loadType&&current.loadType===candidate.loadType){score+=3}
  if(activeGym()&&exerciseAvailableAtActiveGym(candidate)){score+=12;reasons.push("disponível na academia")}
  if(current.unilateral===candidate.unilateral){score+=3}
  if(candidate.favorite){score+=2}
  return{score,reasons};
}

async function ensureCatalogLibrary(){
  for(const d of DIAS){
    for(const e of d.exercicios){
      const atual=exerciseLibrary[e.exerciseId];
      if(!atual){
        const rec=exerciseRecord({
          id:e.exerciseId,name:e.nome,group:e.grupo,
          video:e.video||"",alternateVideoUrl:e.videoAlt||"",alternateVideoLabel:e.videoAltLabel||"Vídeo alternativo",videoStatus:e.videoStatus||"pending",tip:e.dica||"",custom:false,
          equipment:e.equipamento||"",
          loadType:e.loadType||DEFAULT_LOAD_TYPES[e.exerciseId]||"total",
          instructions:Array.isArray(e.dicas)?e.dicas.join(" "):"",
          mistakes:Array.isArray(e.erros)?e.erros.join(" "):""
        });
        exerciseLibrary[rec.id]=rec;
        if(ULDB.db)await ULDB.put("exercises",rec);
        continue;
      }
      // Renomeações curtas e inequívocas. Mantêm o mesmo exerciseId, então
      // o histórico e a progressão continuam ligados ao exercício antigo.
      const novoNome=CATALOG_DISPLAY_NAMES[e.exerciseId];
      const patch={...atual};
      let mudou=false;
      if(novoNome&&patch.name!==novoNome){patch.name=novoNome;mudou=true}
      if(!patch.equipment&&e.equipamento){patch.equipment=e.equipamento;patch.equipmentFamily=equipmentFamily(e.equipamento);mudou=true}
      if((!patch.loadType||patch.loadType==="total")&&e.loadType&&e.loadType!=="total"){patch.loadType=e.loadType;mudou=true}
      // 4.5: preenche apenas links ausentes; nunca sobrescreve vídeo que o usuário já cadastrou.
      if(!patch.video&&e.video){patch.video=e.video;patch.media={...(patch.media||{}),videoUrl:e.video,updatedAt:nowISO()};patch.videoStatus=e.videoStatus||"reference";mudou=true}
      if(!patch.alternateVideoUrl&&e.videoAlt){patch.alternateVideoUrl=e.videoAlt;patch.alternateVideoLabel=e.videoAltLabel||"Vídeo alternativo";mudou=true}
      if(mudou){patch.updatedAt=nowISO();exerciseLibrary[patch.id]=exerciseRecord(patch);if(ULDB.db)await ULDB.put("exercises",exerciseLibrary[patch.id])}
    }
  }
}

/* ---------- carga efetiva para métricas ----------
 * O histórico preserva o valor que o usuário digitou. A conversão abaixo é
 * usada apenas em volume/estimativas, evitando reescrever sessões antigas.
 *
 * Convenção 3.3:
 * - total / per_side_total / stack: usuário registra o TOTAL exibido/usado;
 * - per_dumbbell: usuário registra UM halter e o volume considera o par;
 * - bodyweight: usa o peso corporal vigente na data;
 * - bodyweight_plus: peso corporal + carga adicional registrada.
 *
 * bodyWeightAt prefere a última medição ATÉ a data. Se o treino for anterior a
 * qualquer medição (você treinou antes de começar a se pesar), usa a mais
 * antiga disponível — aproximação deliberada: melhor estimar o volume com o
 * peso mais próximo conhecido do que descartar o treino. Devolve null apenas
 * quando não existe medição alguma, e aí a série é ignorada no volume. */
function bodyWeightAt(date){
  const validos=(bodyLog||[]).filter(x=>!x.deletedAt&&x.weight!==""&&x.weight!=null);
  if(!validos.length)return null;
  const ateData=validos.filter(x=>x.date<=date).sort((a,b)=>a.date<b.date?1:-1);
  const escolhido=ateData[0]||validos.slice().sort((a,b)=>a.date>b.date?1:-1)[0];
  const w=parseFloat(escolhido.weight);
  return Number.isFinite(w)?w:null;
}
function loadTypeOf(exerciseId){return exerciseLibrary[exerciseId]?.loadType||"total"}
function effectiveLoad(registrado,exerciseId,date){
  const l=Number(registrado),tipo=loadTypeOf(exerciseId),temNumero=Number.isFinite(l);
  if(tipo==="per_dumbbell")return temNumero?l*2:null;
  if(tipo==="bodyweight"){const bw=bodyWeightAt(date);return bw==null?null:bw}
  if(tipo==="bodyweight_plus"){const bw=bodyWeightAt(date);return bw==null?null:bw+(temNumero?l:0)}
  return temNumero?l:null;
}
function loadTypeHint(exerciseId){
  switch(loadTypeOf(exerciseId)){
    case "per_side_total":return "Registre a soma dos dois lados (ex.: 30 + 30 = 60 kg).";
    case "per_dumbbell":return "Registre o peso de UM halter. O app considera os dois no cálculo de volume.";
    case "bodyweight":return "Sem carga a registrar. O volume usa seu peso corporal registrado.";
    case "bodyweight_plus":return "Registre só a carga adicional; o app soma seu peso corporal.";
    case "stack":return "Registre o valor indicado na torre/placa.";
    default:return "";
  }
}

/* ===== Preparação para conta e sincronização (local-first) =====
 * Não existe servidor nesta versão. Este módulo cria uma identidade local

 */
let syncIdentity={clientId:null,localUserId:null,mode:"guest",provider:null,email:null,createdAt:null};
let syncState={enabled:false,lastSyncAt:null,lastError:"",serverRevision:null};
function syncEntityEnvelope(entity,type){

    updatedAt:entity.updatedAt||entity.createdAt||nowISO(),deletedAt:entity.deletedAt||null,payload:entity};

/**
 * Tudo que precisa viajar quando a sincronização existir.
 * O contrato tem de cobrir TODOS os stores do banco: se um tipo ficar de fora
 * agora, ele terá de ser encaixado depois — que é exatamente o que esta
 * preparação existe para evitar. Fotos (`media`) entram por último, porque
 * são binários pesados e dados de saúde: exigem decisão explícita de upload.

function syncReadiness(){

  return{mode:syncIdentity.mode,clientId:syncIdentity.clientId,localUserId:syncIdentity.localUserId,
    entities,mediaPending:syncMediaManifest().filter(m=>!m.deletedAt).length,ready:!!syncIdentity.clientId};

/**
 * Mantém a tela acesa durante o treino.
 *
 * A função era CHAMADA em dois lugares e nunca existiu: lançava
 * ReferenceError no fim de renderDay e — pior — dentro do visibilitychange,
 * antes de restoreTimer(). Efeito prático: ao voltar para o app com um treino
 * aberto, o timer de descanso não era restaurado.
 *
 * A API tem suporte irregular (o Safari só ganhou wake lock em versões
 * recentes), então toda falha é silenciosa: não conseguir manter a tela acesa
 * é um incômodo, não um motivo para quebrar o treino.
 */
async function requestWakeLock(){
  try{
    if(!navigator.wakeLock?.request)return null;
    if(wakeLock)return wakeLock;
    wakeLock=await navigator.wakeLock.request("screen");
    // O sistema pode soltar sozinho ao trocar de app; limpamos a referência
    // para que a próxima tentativa peça de novo em vez de achar que já tem.
    wakeLock.addEventListener?.("release",()=>{wakeLock=null});
    return wakeLock;
  }catch(e){wakeLock=null;return null}
}
function releaseWakeLock(){if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  // restoreTimer PRIMEIRO: é o que o usuário percebe. Se o wake lock falhar,
  // o descanso não pode ser perdido junto.
  try{restoreTimer()}catch(e){console.error(e)}
  if(active&&active!=="__videos"){try{requestWakeLock()}catch(e){}}
});

function curDate(){return viewDate||todayISO()}

function shiftDate(days){
  const [y,m,d]=curDate().split("-").map(Number);
  const dt=new Date(y,m-1,d);

// ---------- ordem personalizada dos exercicios ----------
function orderedIdx(d){
  const saved=exOrder[d.id];
  const all=d.exercicios.map((e,i)=>i);
  if(!Array.isArray(saved))return all;
  const byName=new Map(d.exercicios.map((e,i)=>[e.exerciseId,i]));
  const out=[];
  saved.forEach(n=>{if(byName.has(n)&&!out.includes(byName.get(n)))out.push(byName.get(n))});
  all.forEach(i=>{if(!out.includes(i))out.push(i)});
  return out;
}
function moveExercise(dayId,idx,dir){
  const d=workoutDayAt(curDate(),dayId);
  const ord=orderedIdx(d);
  const pos=ord.indexOf(idx);
  const target=pos+dir;
  if(pos<0||target<0||target>=ord.length)return;
  ord.splice(target,0,ord.splice(pos,1)[0]);
  exOrder[d.id]=ord.map(i=>d.exercicios[i].exerciseId);
  vibrate(15);
  save();
  renderDay();
}
function resetOrder(){
  const d=workoutDayAt(curDate(),active);
  if(!d)return;
  delete exOrder[d.id];
  save();

}

// ---------- series extras ----------
function setCount(s,e){return Math.max(e.series,e.series+(s.extra||0))}
function addSet(dayId,idx){
  const d=workoutDayAt(curDate(),dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.exerciseId,e.series);
  if((s.extra||0)>=4)return;
  s.extra=(s.extra||0)+1;
  while(s.sets.filter(x=>!x.deletedAt).length<setCount(s,e))s.sets.push(cloneSet());touchSession(s);
  vibrate(15);
  save();
  updateCard(dayId,idx);
}
function removeSet(dayId,idx){
  const d=workoutDayAt(curDate(),dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.exerciseId,e.series);
  if(!s.extra)return;
  s.extra-=1;
  const a=s.sets.filter(x=>!x.deletedAt),last=a.at(-1);if(last){last.deletedAt=nowISO();last.updatedAt=last.deletedAt}touchSession(s);
  vibrate(15);
  save();
  updateCard(dayId,idx);
}


// ---------- atalhos de registro ----------
function copyPreviousExercise(dayId,idx){
  const d=workoutDayAt(curDate(),dayId),e=d?.exercicios?.[idx];
  if(!d||!e)return false;
  const prev=priorSessions(dayId,e)[0];
  if(!prev)return false;
  const src=prev.sets.filter(x=>!x.deletedAt).slice(0,e.series);
  const target=sessionFor(curDate(),dayId,e.exerciseId,e.series);
  const dst=target.sets.filter(x=>!x.deletedAt).slice(0,e.series);
  src.forEach((x,i)=>{
    if(!dst[i])return;
    dst[i].load=x.load??"";
    dst[i].reps=x.reps??"";
    if(usaRir())dst[i].rir=x.rir??"";
    dst[i].done=false;
    dst[i].updatedAt=nowISO();
  });
  touchSession(target);
  vibrate(18);
  save();
  updateCard(dayId,idx);
  return true;
}

function nextPendingSet(dayId){
  const d=workoutDayAt(curDate(),dayId);if(!d)return null;
  for(const i of orderedIdx(d)){
    const e=d.exercicios[i],s=sessionFor(curDate(),dayId,e.exerciseId,e.series);
    const sets=s.sets.filter(x=>!x.deletedAt).slice(0,e.series+(s.extra||0));
    const setIdx=sets.findIndex(x=>!x.done);
    if(setIdx>=0)return{idx:i,setIdx,exercise:e};
  }
  return null;
}
function workoutSessionTotals(dayId,date=curDate()){
  const d=workoutDayAt(date,dayId);
  if(!d)return{completedSets:0,totalSets:0,volume:0,exercisesDone:0,totalExercises:0};
  let completedSets=0,totalSets=0,volume=0;
  d.exercicios.forEach(e=>{
    const s=getSession(date,dayId,e.exerciseId);
    const count=e.series+(s?.extra||0);totalSets+=count;
    const sets=(s?.sets||[]).filter(x=>!x.deletedAt).slice(0,count);
    sets.forEach(x=>{
      if(!x.done)return;completedSets++;
      const r=Number(x.reps),l=effectiveLoad(x.load,e.exerciseId,date);
      if(Number.isFinite(r)&&Number.isFinite(l))volume+=l*r;
    });
  });
  return{completedSets,totalSets,volume:Math.round(volume),exercisesDone:dayDoneCount(d,date),totalExercises:d.exercicios.length};
}
function workoutNowLabel(dayId){
  const hit=nextPendingSet(dayId);
  if(!hit)return'Treino concluído';

/**
 * Dupla progressão: sem esforço percebido, só repetições e carga.
 * Sobe a carga quando o topo da faixa é atingido em todas as séries em duas
 * sessões comparáveis. Critério objetivo, sem julgamento subjetivo.
 */
function recommendationRepsOnly(dayId,e,s){
  const sets=s.sets.filter(x=>!x.deletedAt).slice(0,e.series);
  if(sets.length<e.series||!sets.every(x=>x.done))return null;

  const complete=sets.every(x=>String(x.load??"").trim()!==""&&String(x.reps??"").trim()!=="");
  if(!complete)return{txt:"Complete carga e repetições de todas as séries para liberar a recomendação.",cls:"warn",confidence:"baixa"};

  const {lo,hi}=parseRange(e.reps);
  const reps=sets.map(x=>Number(x.reps)),loads=sets.map(x=>Number(x.load));
  if([...reps,...loads].some(v=>!Number.isFinite(v)))return{txt:"Há um valor inválido nesta sessão. Corrija antes da recomendação.",cls:"warn",confidence:"baixa"};

  const sameLoad=loads.every(v=>Math.abs(v-loads[0])<1e-9);
  const currentLoad=Math.max(...loads);
  const allTop=reps.every(r=>r>=hi);
  const allAtLeastLo=reps.every(r=>r>=lo);

  if(!sameLoad)return{txt:"Você usou cargas diferentes entre as séries. O registro é válido, mas a sugestão automática fica menos confiável. Compare a próxima sessão antes de progredir.",cls:"",confidence:"média"};

  // Sessões anteriores completas na MESMA carga.
  // Exclui pela data da PRÓPRIA sessão avaliada, e não por curDate(): assim a
  // recomendação não depende de qual dia está aberto na tela.
  const comparable=priorSessions(dayId,e).filter(x=>x.date!==s.date).filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    if(a.length!==e.series||!a.every(z=>z.done&&String(z.load).trim()!==""&&String(z.reps).trim()!==""))return false;
    const max=Math.max(...a.map(z=>Number(z.load)));
    return Number.isFinite(max)&&Math.abs(max-currentLoad)<1e-9;
  }).slice(0,3);

  const priorTop=comparable.filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    return a.every(z=>Number(z.reps)>=hi);
  }).length;

  if(allTop){
    if(priorTop>=1){
      const why=`${priorTop+1} sessões seguidas atingindo ${hi} repetições em todas as séries com ${currentLoad} kg.`;
      return{txt:"Topo da faixa repetido. Teste o menor aumento de carga disponível na próxima sessão.",why,cls:"good",confidence:isAnchorExercise(e)?"alta":"média"};
    }
    return{txt:`Topo da faixa atingido. Repita ${hi} repetições em todas as séries mais uma vez antes de subir a carga.`,why:"Primeira sessão completa nesta carga; o app quer uma confirmação antes de progredir.",cls:"good",confidence:"média"};
  }
  if(!allAtLeastLo)return{txt:`A carga está pesada para a faixa: alguma série ficou abaixo de ${lo} repetições. Mantenha ou reduza levemente e priorize técnica.`,cls:"warn",confidence:"alta"};
  return{txt:`Sessão dentro do alvo. Mantenha a carga e acumule repetições até chegar a ${hi} em todas as séries.`,why:`Faixa ${lo}–${hi} reps. A carga sobe quando o topo for atingido duas vezes.`,cls:"",confidence:"média"};
}

function recommendation(dayId,e,s){
  if(!usaRir())return recommendationRepsOnly(dayId,e,s);
  const sets=s.sets.filter(x=>!x.deletedAt).slice(0,e.series);
  if(sets.length<e.series||!sets.every(x=>x.done))return null;

  const complete=sets.every(x=>String(x.load??"").trim()!==""&&String(x.reps??"").trim()!==""&&String(x.rir??"").trim()!=="");
  if(!complete)return{txt:"Complete carga, reps e RIR de todas as séries para liberar a recomendação.",cls:"warn",confidence:"baixa"};

  const {lo,hi}=parseRange(e.reps),targetMin=rirMin(e.rir);
  const reps=sets.map(x=>Number(x.reps)),rirs=sets.map(x=>Number(x.rir)),loads=sets.map(x=>Number(x.load));
  if([...reps,...rirs,...loads].some(v=>!Number.isFinite(v)))return{txt:"Há um valor inválido nesta sessão. Corrija antes da recomendação.",cls:"warn",confidence:"baixa"};

  const sameLoad=loads.every(v=>Math.abs(v-loads[0])<1e-9);
  const currentLoad=Math.max(...loads);
  const allTop=reps.every(r=>r>=hi);
  const allAtLeastLo=reps.every(r=>r>=lo);
  const effortOk=rirs.every(r=>r>=targetMin);
  const tooHard=rirs.filter(r=>r<=0).length>=2;
  const avgRir=rirs.reduce((a,b)=>a+b,0)/rirs.length;

  const recent=priorSessions(dayId,e).filter(x=>x.date!==s.date).filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    return a.length===e.series&&a.every(z=>z.done&&String(z.load).trim()!==""&&String(z.reps).trim()!==""&&String(z.rir).trim()!=="");
  }).slice(0,3);

  const comparable=recent.filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    const max=Math.max(...a.map(z=>Number(z.load)));
    return Number.isFinite(max)&&Math.abs(max-currentLoad)<1e-9;
  });

  const priorStrong=comparable.filter(x=>{
    const a=x.sets.filter(z=>!z.deletedAt).slice(0,e.series);
    return a.every(z=>Number(z.reps)>=Math.max(lo,hi-1)&&Number(z.rir)>=targetMin);
  }).length;

  if(!sameLoad)return{txt:"Você usou cargas diferentes entre as séries. O registro é válido, mas a sugestão automática fica menos confiável. Compare a próxima sessão antes de progredir.",cls:"",confidence:"média"};

  if(allTop&&effortOk){
    if(priorStrong>=1){
      const why=`${priorStrong+1} exposições fortes na mesma carga; todas as séries chegaram ao topo da faixa com RIR ≥ ${targetMin}.`;
      return{txt:"Desempenho forte repetido. Teste o menor aumento de carga disponível na próxima sessão.",why,cls:"good",confidence:isAnchorExercise(e)?"alta":"média"};
    }
    return{txt:"Topo da faixa atingido com RIR adequado. Repita esse desempenho mais uma vez antes de subir a carga.",why:`Primeira confirmação forte nesta carga; o app ainda quer mais uma exposição comparável.`,cls:"good",confidence:"média"};
  }
  if(!allAtLeastLo||tooHard)return{txt:"A carga está pesada para a faixa-alvo ou o esforço ficou muito alto. Mantenha ou reduza levemente e priorize técnica e recuperação.",cls:"warn",confidence:"alta"};
  if(avgRir>targetMin+2&&reps.every(r=>r>=lo))return{txt:"Você ficou claramente acima do RIR previsto. Mantenha a técnica e tente mais repetições antes de aumentar a carga.",cls:"",confidence:"média"};
  return{txt:"Sessão dentro do alvo. Mantenha a carga e tente acumular repetições com o RIR prescrito.",why:`Faixa ${lo}–${hi} reps; RIR-alvo mínimo ${targetMin}; ainda não há evidência suficiente para subir a carga.`,cls:"",confidence:"média"};
}

/**
 * Progresso de um treino numa data. Usa o plano vigente ÀQUELA data (o plano
 * congelado, se existir), não o programa de hoje. Sem isso, editar o programa
 * reescrevia o passado: um treino de 8 exercícios virava 6 retroativamente.
 * Aceita o objeto do dia ou apenas o id.
 */
function workoutProgressOn(date,day){
  const dayId=typeof day==="string"?day:day?.id;
  if(!dayId)return{done:0,total:0,sets:0};
  const items=planItems(date,dayId);
  if(!items.length)return{done:0,total:0,sets:0};
  let done=0,sets=0;
  items.forEach(it=>{
    const s=getSession(date,dayId,it.exerciseId);
    if(!s)return;
    const ativas=s.sets.filter(x=>!x.deletedAt);
    const c=ativas.slice(0,setCount(s,{series:it.series})).filter(x=>x.done).length;
    sets+=c;
    if(c>=it.series)done++;
  });
  return{done,total:items.length,sets}
}

    if(p.done===p.total)completed++;

}

/* ---------- séries temporais para o dashboard ---------- */

/** Volume de uma data: soma de carga × reps das séries concluídas e não apagadas.
 *  Lê o que foi REGISTRADO naquele dia — inclusive exercícios que já saíram do
 *  programa. Antes percorria DIAS e perdia justamente esse histórico. */
function volumeOnDate(date){
  let v=0;
  const doDia=sessions[date]||{};
  Object.values(doDia).forEach(porExercicio=>{
    Object.values(porExercicio||{}).forEach(s=>{
      if(!s||s.deletedAt||!Array.isArray(s.sets))return;
      s.sets.forEach(x=>{
        if(!x.done||x.deletedAt)return;
        const r=Number(x.reps);
        if(!Number.isFinite(r))return;
        const l=effectiveLoad(x.load,s.exerciseId,s.date);
        if(Number.isFinite(l))v+=l*r;
      });
    });
  });
  return v;
}

/**
 * Últimas `n` semanas (segunda a domingo), da mais antiga para a mais recente.
 * Cada item: volume total, treinos completos, treinos planejados e séries.
 * A semana corrente entra parcial — é o esperado num painel.
 */
function weekSeries(n=8,ref=new Date()){
  const out=[],base=mondayOf(ref);
  for(let w=n-1;w>=0;w--){
    const mon=new Date(base);mon.setDate(base.getDate()-w*7);
    let volume=0,sets=0,completed=0,planned=0;
    for(let i=0;i<7;i++){
      const d=new Date(mon);d.setDate(mon.getDate()+i);
      const wd=workoutDayForDate(d);if(!wd)continue;
      planned++;
      const iso=isoFromDate(d),p=workoutProgressOn(iso,wd);
      sets+=p.sets;volume+=volumeOnDate(iso);
      if(p.total&&p.done===p.total)completed++;
    }
    out.push({start:isoFromDate(mon),label:fmtDate(isoFromDate(mon)),volume:Math.round(volume),sets,completed,planned});
  }
  return out;
}

/**
 * Sequência atual de dias de treino planejados que foram concluídos,
 * contando para trás. Dias sem treino previsto não quebram a sequência.
 * O dia de hoje, se ainda estiver incompleto, também não quebra.
 */
function currentStreak(ref=new Date()){
  let streak=0;
  const hoje=isoFromDate(ref);
  for(let i=0;i<180;i++){
    const d=new Date(ref);d.setDate(ref.getDate()-i);
    const wd=workoutDayForDate(d);
    if(!wd)continue;
    const iso=isoFromDate(d),p=workoutProgressOn(iso,wd);
    const completo=p.total&&p.done===p.total;
    if(completo){streak++;continue}
    if(iso===hoje)continue; // hoje ainda dá tempo
    break;
  }
  return streak;
}

/** Melhor série da semana corrente por 1RM estimado, para destaque no painel.
 *  Varre o que foi registrado, então continua achando o destaque mesmo que o
 *  exercício tenha saído do programa depois. */
function bestSetOfWeek(ref=new Date()){
  const mon=mondayOf(ref);let best=null;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const iso=isoFromDate(d),doDia=sessions[iso]||{};
    Object.values(doDia).forEach(porExercicio=>{
      Object.values(porExercicio||{}).forEach(s=>{
        if(!s||s.deletedAt||!Array.isArray(s.sets))return;
        s.sets.forEach(x=>{
          if(!x.done||x.deletedAt)return;
          const efetiva=effectiveLoad(x.load,s.exerciseId,s.date);
          const est=estimated1RM(efetiva,x.reps);
          if(est==null)return;
          if(!best||est>best.est)best={est,load:Number(x.load),reps:Number(x.reps),
            efetiva,name:exerciseName(s.exerciseId),date:iso,tipo:loadTypeOf(s.exerciseId)};
        });
      });
    });
  }
  return best;
}

/** Variação percentual entre as duas últimas semanas com volume registrado. */
function volumeTrend(series){
  const comVolume=series.filter(w=>w.volume>0);
  if(comVolume.length<2)return null;
  const atual=comVolume.at(-1).volume,anterior=comVolume.at(-2).volume;
  if(!anterior)return null;
  return Math.round(((atual-anterior)/anterior)*100);
}



function migrationReport(){
  const legacyDates=Object.keys(LEGACY_SESSION_SNAPSHOT||{}).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
  const current=allSessionRecords();
  const legacyCount=legacyDates.reduce((n,date)=>{
    const byDay=LEGACY_SESSION_SNAPSHOT[date]||{};
    return n+Object.values(byDay).reduce((s,byEx)=>s+Object.keys(byEx||{}).length,0);
  },0);
  const unmatched=[];
  legacyDates.forEach(date=>{
    const byDay=LEGACY_SESSION_SNAPSHOT[date]||{};
    Object.entries(byDay).forEach(([day,byEx])=>{
      Object.keys(byEx||{}).forEach(name=>{if(!exerciseIdFromName(name))unmatched.push({date,day,name})});
    });
  });
  return {legacyCount,migratedCount:current.length,unmatched,exact:(legacyCount===0||legacyCount===current.length)&&unmatched.length===0};
}

function runIntegrityCheck(){
  const issues=[],ids=new Set(),catalog=new Set();

  // A fonte de verdade dos exercícios é a BIBLIOTECA, não o catálogo embutido
  // (DIAS). Validar contra DIAS gerava falso positivo em uso normal: criar um
  // exercício próprio e treinar com ele fazia o diagnóstico acusar
  // "Sessão órfã", porque o id não existe no programa original de fábrica.
  // Exercícios com soft-delete continuam contando: o histórico aponta para
  // eles legitimamente.
  Object.values(exerciseLibrary||{}).forEach(e=>{if(e?.id)catalog.add(e.id)});
  DIAS.forEach(d=>d.exercicios.forEach(e=>{if(e.exerciseId)catalog.add(e.exerciseId)}));

  // Colisão real de id só existe dentro do MESMO dia, porque a chave da sessão
  // é date:dayId:exerciseId. O mesmo movimento em dois dias é legítimo e
  // desejável — é o que unifica histórico e recordes.
  const diasParaChecar=(activeProgram()?.days||[]).map(d=>({label:d.label,ids:d.items.map(i=>i.exerciseId)}))
    .concat(DIAS.map(d=>({label:d.label,ids:d.exercicios.map(e=>e.exerciseId)})));
  diasParaChecar.forEach(d=>{
    const noDia=new Set();
    d.ids.forEach(id=>{
      if(!id){issues.push("Exercício sem exerciseId em "+d.label);return}
      if(noDia.has(id))issues.push("exerciseId repetido no mesmo dia ("+d.label+"): "+id);
      noDia.add(id);
    });
  });
  allSessionRecords().forEach(s=>{
    if(!s.id)issues.push("Sessão sem id.");
    else if(ids.has(s.id))issues.push("ID de sessão duplicado: "+s.id);
    else ids.add(s.id);
    if(!s.exerciseId)issues.push("Sessão sem exerciseId: "+(s.id||"(sem id)")+" em "+(s.date||"data desconhecida"));
    else if(!catalog.has(s.exerciseId))issues.push("Sessão órfã ("+(s.date||"?")+"): exercício \""+s.exerciseId+"\" não está na biblioteca");
    if(!s.createdAt||!s.updatedAt)issues.push("Sessão sem timestamps: "+s.id);
    if(!Array.isArray(s.sets))issues.push("Sessão sem séries: "+s.id);
    else s.sets.forEach((x,i)=>{
      if(!x.id)issues.push("Série sem id em "+s.id+" #"+(i+1));
      if(x.rir!==""&&x.rir!=null&&!Number.isFinite(Number(x.rir)))issues.push("RIR inválido em "+s.id);
      if(x.reps!==""&&x.reps!=null&&!Number.isFinite(Number(x.reps)))issues.push("Reps inválidas em "+s.id);
      if(x.load!==""&&x.load!=null&&!Number.isFinite(Number(x.load)))issues.push("Carga inválida em "+s.id);
    });
  });
  bodyLog.forEach(x=>{if(!x.id||!x.updatedAt)issues.push("Medição corporal incompleta: "+(x.date||"sem data"))});
  Object.values(checkins).forEach(x=>{if(!x.id||!x.updatedAt)issues.push("Check-in incompleto: "+(x.date||"sem data"))});
  return{ok:issues.length===0,issues,sessions:allSessionRecords().length,body:bodyLog.length,checkins:Object.keys(checkins).length,exerciseIds:catalog.size,storage:storageHealth};
}
function showIntegrityCheck(){
  const r=runIntegrityCheck();
  const storage=r.storage.ok?"armazenamento OK":"erro de armazenamento";
  if(r.ok)alert(`Integridade OK.\n\n${r.exerciseIds} exercícios com IDs estáveis\n${r.sessions} sessões\n${r.body} medições corporais\n${r.checkins} check-ins\n${storage}`);
  else alert("Foram encontrados "+r.issues.length+" problema(s):\n\n"+r.issues.slice(0,12).join("\n")+(r.issues.length>12?"\n…":""));
}

function bodyChart(field){
  const pts=bodyLog.filter(x=>x[field]!==""&&x[field]!=null&&Number.isFinite(+x[field])).sort((a,b)=>a.date>b.date?1:-1).slice(-12);
  if(pts.length<2)return `<div class="v2empty">Registre pelo menos duas medições para gerar o gráfico.</div>`;
  const vals=pts.map(p=>+p[field]),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,W=300,H=115,pad=10;
  const cs=pts.map((p,i)=>({x:pad+i*(W-pad*2)/(pts.length-1),y:H-pad-(+p[field]-min)/range*(H-pad*2)}));
  const line=cs.map((c,i)=>(i?"L":"M")+c.x.toFixed(1)+" "+c.y.toFixed(1)).join(" ");
  return `<div class="v2chart"><svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="#D4A72C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${cs.map(c=>`<circle cx="${c.x}" cy="${c.y}" r="3" fill="#D4A72C"/>`).join("")}</svg><div class="v2chart-foot"><span>${fmtLong(pts[0].date)} · ${pts[0][field]}</span><span>${fmtLong(pts.at(-1).date)} · ${pts.at(-1)[field]}</span></div></div>`;
}

function estimated1RM(load,reps){
  load=Number(load);reps=Number(reps);
  if(!Number.isFinite(load)||!Number.isFinite(reps)||load<=0||reps<=0)return null;
  if(reps===1)return load;
  if(reps>15)return null;
  return load*(1+reps/30);
}
function exerciseRecords(dayId,e){
  let bestLoad=null,bestE1RM=null,bestVolumeSet=null,bestDate=null;
  Object.keys(sessions).sort().forEach(date=>{
    const s=getSession(date,dayId,e.exerciseId);if(!s)return;
    s.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{
      const load=Number(x.load),reps=Number(x.reps);
      if(Number.isFinite(load)&&load>0&&(bestLoad==null||load>bestLoad)){bestLoad=load;bestDate=date}
      const one=estimated1RM(load,reps);
      if(one!=null&&(bestE1RM==null||one>bestE1RM))bestE1RM=one;
      const vol=load*reps;
      if(Number.isFinite(vol)&&vol>0&&(bestVolumeSet==null||vol>bestVolumeSet))bestVolumeSet=vol;
    })
  });
  return{bestLoad,bestE1RM,bestVolumeSet,bestDate}
}
function currentSessionPRs(dayId,e,s){
  const hist=exerciseRecords(dayId,e);
  const vals=s.sets.filter(x=>!x.deletedAt&&x.done);
  if(!vals.length)return[];
  const maxLoad=Math.max(...vals.map(x=>Number(x.load)).filter(Number.isFinite),-Infinity);
  const maxE=Math.max(...vals.map(x=>estimated1RM(x.load,x.reps)).filter(x=>x!=null),-Infinity);
  const maxV=Math.max(...vals.map(x=>Number(x.load)*Number(x.reps)).filter(Number.isFinite),-Infinity);
  const prior=priorSessions(dayId,e);
  let prevLoad=-Infinity,prevE=-Infinity,prevV=-Infinity;
  prior.forEach(ps=>ps.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{
    const l=Number(x.load),r=Number(x.reps),er=estimated1RM(l,r),v=l*r;
    if(Number.isFinite(l))prevLoad=Math.max(prevLoad,l);
    if(er!=null)prevE=Math.max(prevE,er);
    if(Number.isFinite(v))prevV=Math.max(prevV,v);
  }));
  const out=[];
  if(Number.isFinite(maxLoad)&&maxLoad>prevLoad)out.push("PR carga");
  if(Number.isFinite(maxE)&&maxE>prevE)out.push("PR e1RM");
  if(Number.isFinite(maxV)&&maxV>prevV)out.push("PR série");
  return out;
}
function monthStats(date=new Date()){
  const y=date.getFullYear(),m=date.getMonth(),prefix=y+"-"+String(m+1).padStart(2,"0")+"-";
  const rows=allSessionRecords().filter(s=>s.date.startsWith(prefix));
  const completedSets=rows.reduce((n,s)=>n+s.sets.filter(x=>!x.deletedAt&&x.done).length,0);
  const dates=new Set(rows.filter(s=>s.sets.some(x=>!x.deletedAt&&x.done)).map(s=>s.date));
  let volume=0;
  rows.forEach(s=>s.sets.filter(x=>!x.deletedAt&&x.done).forEach(x=>{const l=Number(x.load),r=Number(x.reps);if(Number.isFinite(l)&&Number.isFinite(r))volume+=l*r}));
  const body=bodyLog.filter(x=>x.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
  const weightDelta=body.length>=2&&body[0].weight&&body.at(-1).weight?(Number(body.at(-1).weight)-Number(body[0].weight)):null;
  return{workoutDays:dates.size,completedSets,volume:Math.round(volume),weightDelta}
}
function warmupPlan(load,e){
  load=Number(load);
  if(!Number.isFinite(load)||load<=0)return[];
  const compound=["Peito","Costas","Quadríceps","Posterior","Glúteos"].includes(e.grupo);
  const p=compound?[[.4,8],[.6,5],[.75,3],[.88,1]]:[[.5,8],[.7,4]];
  return p.map(([pct,reps],i)=>({label:"Aquecimento "+(i+1),load:Math.max(1,Math.round(load*pct*2)/2),reps,pct:Math.round(pct*100)}));
}
function openWarmup(dayId,idx){
  const d=runtimeDayById(dayId),e=d.exercicios[idx],s=sessionFor(curDate(),dayId,e.exerciseId,e.series);

  const entered=activeSets.map(x=>Number(x.load)).find(x=>Number.isFinite(x)&&x>0);
  const prev=priorSessions(dayId,e)[0];
  const prevLoad=prev?.sets?.map(x=>Number(x.load)).find(x=>Number.isFinite(x)&&x>0);
  const target=entered||prevLoad;
  if(!target){alert("Digite a carga de trabalho ou tenha uma sessão anterior para calcular o aquecimento.");return}

}

/**
 * Recordes de carga por movimento. Percorre o HISTÓRICO, não o programa:
 * um exercício que você tirou da rotina continua com o recorde preservado.
 * Antes isso iterava DIAS e o PR sumia no instante em que você trocava o
 * exercício — o dado seguia no banco, mas invisível.
 */
function allPRs(){
  const porExercicio=new Map();
  Object.values(sessions||{}).forEach(porDia=>{
    Object.values(porDia||{}).forEach(porEx=>{
      Object.values(porEx||{}).forEach(s=>{
        if(!s||s.deletedAt||!Array.isArray(s.sets))return;
        s.sets.forEach(x=>{
          const v=parseFloat(x.load);
          if(!Number.isFinite(v)||!x.done||x.deletedAt)return;
          const atual=porExercicio.get(s.exerciseId);
          if(!atual)porExercicio.set(s.exerciseId,{exerciseId:s.exerciseId,name:exerciseName(s.exerciseId),value:v,group:exerciseGroup(s.exerciseId)});
          else if(v>atual.value)atual.value=v;
        });
      });
    });
  });
  return [...porExercicio.values()].sort((a,b)=>b.value-a.value);
}

/* ===== Demonstrações visuais de execução =====
 *
 * Desenho e animação próprios (SVG + CSS). Nada é copiado de biblioteca de
 * terceiros, o que mantém o app livre para distribuição.
 *
 * COMO FUNCIONA
 *   EXERCISE_VISUAL_DEMOS[exerciseId] = { figure, title, primary, ... }
 *   `figure` aponta para uma função em DEMO_FIGURES que devolve o SVG.
 *   Vários exercícios podem reaproveitar a mesma figura.
 *
 * REGRAS DE DESENHO (aprendidas na marra)
 *   1. Segmentos giram em torno da ARTICULAÇÃO, não do centro da caixa.
 *      Use transform-box:view-box e transform-origin em coordenadas absolutas
 *      do viewBox. Percentuais com fill-box mudam de lugar sempre que você
 *      acrescenta um elemento ao grupo — foi o que deslocava o movimento.
 *   2. O implemento (halter, barra) fica DENTRO do grupo do antebraço.
 *      Assim ele herda as rotações e nunca descola da mão. Animar o peso em
 *      separado não funciona: a mão descreve um arco, a translação é reta, e
 *      os dois divergem no meio do movimento.
 *   3. Se o implemento precisar parecer nivelado, aplique uma rotação estática
 *      que cancele a soma das rotações no início do ciclo.
 *   4. Todas as animações usam a mesma duração e os mesmos percentuais de
 *      keyframe, senão os segmentos dessincronizam.
 */

const LOAD_TYPES=[["total","Peso total"],["per_side_total","Anilhas por lado (registre o total dos dois lados)"],["per_dumbbell","Peso de cada halter"],["stack","Torre / placa selecionada"],["bodyweight","Peso corporal"],["bodyweight_plus","Peso corporal + carga"]];
function loadTypeLabel(v){return (LOAD_TYPES.find(x=>x[0]===v)||LOAD_TYPES[0])[1]}

function programStats(p){
  const dias=p.days.length;
  const exs=p.days.reduce((n,d)=>n+d.items.length,0);
  const series=p.days.reduce((n,d)=>n+d.items.reduce((m,i)=>m+i.series,0),0);
  return{dias,exs,series};
}

function dayMuscleSummary(d){
  const map={};for(const it of d.items){const g=exerciseGroup(it.exerciseId)||"Outros";map[g]=(map[g]||0)+(Number(it.series)||0)}
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function programMuscleSummary(p){
  const map={};for(const d of p.days)for(const [g,n] of dayMuscleSummary(d))map[g]=(map[g]||0)+n;
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function exerciseMetaLine(e){return [e.group,e.movementPattern,e.equipment].filter(Boolean).join(" · ")}

    <button class="clear" data-action="clear-day">Limpar apenas as marcações de ${isToday()?"hoje":fmtDate(date)}</button>

    <div class="timerpanel" id="timer-panel" hidden>
      <div class="timerhead"><b>Timer de descanso</b><button class="timerclose" data-action="timer-toggle">×</button></div>

function workoutFinishCard(d,date){
  if(dayDoneCount(d,date)!==d.exercicios.length)return"";
  const t=workoutSessionTotals(d.id,date);
  return `<div class="workout-complete">
    <div class="complete-icon">✓</div>
    <div><div class="meta">SESSÃO CONCLUÍDA</div><h3>${esc(d.label)}</h3><p>${t.completedSets} séries concluídas${t.volume?` · ${t.volume.toLocaleString("pt-BR")} kg·reps`:""}</p></div>
    <button class="v2primary" data-action="finish-workout">Finalizar treino</button>
  </div>`;
}

function exerciseCard(d,e,i,date){
  const s=sessionFor(date,d.id,e.exerciseId,e.series),activeSets=s.sets.filter(x=>!x.deletedAt),count=e.series+(s.extra||0);
  const done=exerciseDone(date,d.id,e),vid=videoFor(d.id,e),prior=priorSessions(d.id,e),legacy=legacyHistory(d.id,e);
  const prev=prior[0],rec=recommendation(d.id,e,s),points=trendPoints(d.id,e);
  const k=stableKey(d.id,e.exerciseId);
  const ord=orderedIdx(d),pos=ord.indexOf(i);
  const pending=nextPendingSet(d.id),isCurrent=!!pending&&pending.idx===i;
  const collapsed=done&&date===todayISO()&&!workoutExpandedDoneCards.has(k);
  if(collapsed){
    return `<div class="card done compact-done" data-card="${d.id}|${i}">
      <div class="compact-done-main"><div><div class="meta" style="color:${d.cor}">${e.grupo}</div><div class="exname">${e.nome}<span class="done-chip">Concluído</span></div><div class="compact-summary">${esc(sessionSummary(s))}</div></div>
      <button class="v2secondary compact" data-action="expand-done" data-day="${d.id}" data-idx="${i}" data-key="${esc(k)}">Rever</button></div>
    </div>`;
  }

  const previousHtml=prev
    ?`<div class="prevbox prevbox-action"><div><b>Última sessão ${fmtDate(prev.date)}</b><br>${esc(sessionSummary(prev))}</div>${date===todayISO()?`<button class="v2secondary compact" data-action="copy-previous" data-day="${d.id}" data-idx="${i}">Usar valores</button>`:""}</div>`
    :legacy[0]
      ?`<div class="prevbox legacy"><b>Histórico antigo ${fmtDate(legacy[0].d)}</b><br>${esc(legacy[0].v||"—")}kg${legacy[0].r!=null?` · ${legacy[0].r} reps`:""}</div>`
      :`<div class="prevbox">Primeira sessão detalhada neste exercício.</div>`;

  const history=[
    ...prior.slice(0,6).map(x=>`<div class="histitem"><b>${fmtDate(x.date)}</b><br>${esc(sessionSummary(x))}${x.note?`<br>Nota: ${esc(x.note)}`:""}</div>`),
    ...legacy.slice(0,4).map(h=>`<div class="histitem legacy"><b>${fmtDate(h.d)} · histórico antigo</b><br>${esc(h.v||"—")}kg${h.r!=null?` · ${h.r} reps`:""}</div>`)
  ].join("");

  const spark=points.length>=2
    ?`<div class="spark"><div class="sparkhead"><span>Evolução da melhor carga</span><span>${points[0].v} → ${points.at(-1).v}kg</span></div>${sparkSVG(points,d.cor)}<div class="sparkfoot"><span>${fmtDate(points[0].d)}</span><span>${fmtDate(points.at(-1).d)}</span></div></div>`
    :"";

  const firstPending=activeSets.slice(0,count).findIndex(x=>!x.done);
  const rows=activeSets.slice(0,count).map((x,si)=>`<div class="setrow ${usaRir()?"":"norir "}${si>=e.series?"bonus":""} ${isCurrent&&si===firstPending?"current-set":""}">
    <div class="setlabel">${si>=e.series?"+"+(si-e.series+1):si+1}</div>
    <input class="field" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="load" placeholder="kg" value="${esc(x.load)}">
    <input class="field" inputmode="numeric" enterkeyhint="done" autocomplete="off" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="reps" placeholder="reps" value="${esc(x.reps)}">
    ${usaRir()?`<input class="field" inputmode="numeric" enterkeyhint="done" autocomplete="off" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="rir" placeholder="RIR" value="${esc(x.rir)}">`:""}
    <button class="setdone ${x.done?"on":""}" data-action="toggle-set" data-day="${d.id}" data-idx="${i}" data-set="${si}">${x.done?"✓":"○"}</button>
  </div>`).join("");

  return `<div class="card ${done?"done":""} ${isCurrent?"current-exercise":""}" data-card="${d.id}|${i}">
    <div class="cardhead">
      <div style="min-width:0">
        <div class="meta" style="color:${d.cor}">${e.grupo}</div>
        <div class="exname">${e.nome}${isCurrent?'<span class="now-chip">Agora</span>':""}${e.ancora?'<span class="anchor">âncora</span>':""}<span class="videobadge ${vid.status==="pending"||vid.status==="unverified"||vid.status==="reference"?"pending":"ok"}">${videoLabel(vid.status)}</span></div>
      </div>
      <div class="movebox">
        <button class="movebtn" data-action="move-up" data-day="${d.id}" data-idx="${i}" ${pos<=0?"disabled":""} aria-label="Subir">↑</button>
        <button class="movebtn" data-action="move-down" data-day="${d.id}" data-idx="${i}" ${pos>=ord.length-1?"disabled":""} aria-label="Descer">↓</button>
        <button class="checkex ${done?"on":""}" data-action="toggle-ex" data-day="${d.id}" data-idx="${i}">${checkIcon()}</button>
      </div>
    </div>

    <div class="exercise-prescription"><span><b>${e.series}×</b> séries</span><span><b>${e.reps}</b> reps</span><span><b>${Math.round(e.rest/60*10)/10}</b> min descanso</span></div>
    ${e.equipment||e.loadType!=="total"?`<div class="source">${e.equipment?esc(e.equipment)+" · ":""}${loadTypeLabel(e.loadType)}</div>`:""}
    ${loadTypeHint(e.exerciseId)?`<div class="loadhint">${esc(loadTypeHint(e.exerciseId))}</div>`:""}
    ${vid.fonte?`<div class="source">${esc(vid.fonte)}</div>`:""}
    ${date===todayISO()?`<div class="workout-tools"><button class="v2secondary compact" data-action="workout-swap" data-day="${d.id}" data-idx="${i}">⇄ Trocar exercício</button>${done?`<button class="v2secondary compact" data-action="collapse-done" data-day="${d.id}" data-idx="${i}" data-key="${esc(k)}">Recolher</button>`:""}</div>`:""}

    <details class="tech native-detail" data-dk="tech|${k}"><summary><span>Técnica e demonstração</span><b>›</b></summary><div class="techbody">
      <b>Pontos-chave</b><ul>${(e.dicas||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>Use uma execução estável e controlada.</li>"}</ul>

let timerEnd=0,timerInterval=null,timerLabel="";
function persistTimer(){
  try{
    if(timerEnd)localStorage.setItem("treino-timer-ul",JSON.stringify({end:timerEnd,label:timerLabel}));
    else localStorage.removeItem("treino-timer-ul");
  }catch(e){}
}
// o iOS congela o app em segundo plano: retoma o descanso pelo horario-alvo salvo
function restoreTimer(){
  try{
    const raw=localStorage.getItem("treino-timer-ul");
    if(!raw){timerEnd=0;updateTimerUI();return}
    const t=JSON.parse(raw);
    if(!t||!t.end||t.end<=Date.now()){localStorage.removeItem("treino-timer-ul");timerEnd=0;updateTimerUI();return}
    timerEnd=t.end;timerLabel=t.label||"";
    if(timerInterval)clearInterval(timerInterval);
    timerInterval=setInterval(updateTimerUI,250);
    updateTimerUI();
  }catch(e){}
}
function formatTimer(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(seconds,label=""){timerEnd=Date.now()+seconds*1000;timerLabel=label;persistTimer();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerUI,250);const p=document.getElementById("timer-panel");if(p)p.hidden=true;updateTimerUI()}

const ANILHAS=[25,20,15,10,5,2.5,1.25];
function openPlateCalculator(){
  vibrate(15);
  document.getElementById("modal-root").innerHTML=`<div class="modal-overlay" data-action="close-calc"><div class="modal" data-stop="1">
    <div class="modal-title"><span>Calculadora de anilhas</span><button class="modal-close" data-action="close-calc">×</button></div>
    <div class="modal-field"><label>Peso total desejado (barra + anilhas, kg)</label><input type="number" id="calc-total" class="modal-input" placeholder="Ex: 80" inputmode="decimal" step="0.5"></div>
    <div class="modal-field"><label>Peso da barra (kg)</label><input type="number" id="calc-bar" class="modal-input" value="20" inputmode="decimal" step="0.5"></div>

function computePlates(){
  const out=document.getElementById("calc-output");if(!out)return;
  const total=parseFloat(String(document.getElementById("calc-total").value).replace(",","."));
  const bar=parseFloat(String(document.getElementById("calc-bar").value).replace(",","."))||0;
  if(!Number.isFinite(total)){out.innerHTML=`<div class="plate-result err">Informe o peso total.</div>`;return}
  if(total<bar){out.innerHTML=`<div class="plate-result err">O peso total não pode ser menor que a barra.</div>`;return}
  if(total===bar){out.innerHTML=`<div class="plate-result">Só a barra — sem anilhas.</div>`;return}
  let rem=Math.round(((total-bar)/2)*100)/100;
  const usadas=[];
  for(const pl of ANILHAS){const c=Math.floor(rem/pl);if(c>0){usadas.push(c+"× "+pl+"kg");rem=Math.round((rem-c*pl)*100)/100}}
  const sobra=rem>0?`<br><small>Faltam ${rem}kg por lado — o mais próximo montável é ${total-rem*2}kg.</small>`:"";
  out.innerHTML=`<div class="plate-result"><b>Por lado da barra:</b><br>${usadas.length?usadas.join("<br>"):"—"}${sobra}</div>`;
  vibrate(15);
}

function validateRoundTrip(){
