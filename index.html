<meta name="description" content="Registro de treino Upper/Lower 4x por semana com carga, reps e RIR por série.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;background:#14161A;color:#F2F0EA;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #D4A72C;outline-offset:2px;border-radius:8px}
.wrap{min-height:100vh}
.header{padding:26px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:#9A9DA3;font-size:12px;letter-spacing:2px;text-transform:uppercase}.brand b{color:#D4A72C;font-size:20px}.title{font-size:31px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px}.sub{color:#9A9DA3;font-size:13px;line-height:1.4}
.weekring{flex-shrink:0;text-align:center}.ringwrap{position:relative;width:58px;height:58px}.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.wlabel{font-size:10px;color:#9A9DA3;letter-spacing:1px;text-transform:uppercase;margin-top:6px;font-variant-numeric:tabular-nums}
.days{padding:16px 20px 34px;display:flex;flex-direction:column;gap:12px}.day{position:relative;text-align:left;width:100%;background:#1D2025;border:1px solid #2A2D33;border-radius:16px;padding:19px 20px;color:#F2F0EA;overflow:hidden;transition:transform .15s,border-color .15s,background .15s}.day:active{transform:scale(.985);background:#20242A}.bar{position:absolute;left:0;top:0;width:4px;height:100%}.daytop{display:flex;justify-content:space-between;align-items:center;gap:14px}.dayname{font-size:19px;font-weight:750}.focus{font-size:13.5px;color:#9A9DA3;margin-top:3px}.dayright{display:flex;align-items:center;gap:10px}.count{font-size:11.5px;border-radius:999px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.rest{margin-top:4px;padding:15px;border:1px dashed #2A2D33;border-radius:16px;color:#82868D;font-size:13px;text-align:center}

function safeGet(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch{return f}}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekKey(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const dayNum=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dayNum+3);const firstThursday=new Date(Date.UTC(d.getUTCFullYear(),0,4));const week=1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);return d.getUTCFullYear()+"-W"+String(week).padStart(2,"0")}
function fmtDate(iso){const [y,m,d]=iso.split("-");return d+"/"+m}
function key(d,n){return d+"|"+n}
function parseRange(s){const a=(String(s).match(/\d+/g)||[]).map(Number);return{lo:a[0]||0,hi:a[1]||a[0]||0}}
function rirMin(s){const a=(String(s).match(/\d+/g)||[]).map(Number);return a.length?Math.min(...a):0}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

let wakeLock=null;
async function requestWakeLock(){
  if(!("wakeLock" in navigator)||wakeLock)return;
  try{wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null});}catch(e){wakeLock=null}
}
function releaseWakeLock(){if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){if(active&&active!=="__videos")requestWakeLock();restoreTimer();}
});

function vibrate(p){if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

// ---------- data em edicao ----------
function curDate(){return viewDate||todayISO()}
function isToday(){return curDate()===todayISO()}
function shiftDate(days){
  const [y,m,d]=curDate().split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+days);
  viewDate=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  if(viewDate>todayISO())viewDate=todayISO();
  renderDay();
}
function setDate(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return;
  viewDate=v>todayISO()?todayISO():v;
  renderDay();
}
function fmtDateLong(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  const dias=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  return dias[dt.getDay()]+", "+String(d).padStart(2,"0")+"/"+String(m).padStart(2,"0");
}

function detailsState(){
  const m={};
  document.querySelectorAll("details[data-dk]").forEach(el=>{if(el.open)m[el.dataset.dk]=1});
  return m;
}
function restoreDetails(m){
  if(!m)return;
  document.querySelectorAll("details[data-dk]").forEach(el=>{if(m[el.dataset.dk])el.open=true});
}

// ---------- ordem personalizada dos exercicios ----------
function orderedIdx(d){
  const saved=exOrder[d.id];
  const all=d.exercicios.map((e,i)=>i);
  if(!Array.isArray(saved))return all;
  const byName=new Map(d.exercicios.map((e,i)=>[e.nome,i]));
  const out=[];
  saved.forEach(n=>{if(byName.has(n)&&!out.includes(byName.get(n)))out.push(byName.get(n))});
  all.forEach(i=>{if(!out.includes(i))out.push(i)});
  return out;
}
function moveExercise(dayId,idx,dir){
  const d=DIAS.find(x=>x.id===dayId);
  const ord=orderedIdx(d);
  const pos=ord.indexOf(idx);
  const target=pos+dir;
  if(pos<0||target<0||target>=ord.length)return;
  ord.splice(target,0,ord.splice(pos,1)[0]);
  exOrder[d.id]=ord.map(i=>d.exercicios[i].nome);
  vibrate(15);
  save();
  renderDay();
}
function resetOrder(){
  const d=DIAS.find(x=>x.id===active);
  if(!d)return;
  delete exOrder[d.id];
  save();
  renderDay();
}

// ---------- series extras ----------
function setCount(s,e){return Math.max(e.series,e.series+(s.extra||0))}
function addSet(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.nome,e.series);
  if((s.extra||0)>=4)return;
  s.extra=(s.extra||0)+1;
  while(s.sets.length<setCount(s,e))s.sets.push({load:"",reps:"",rir:"",done:false});
  vibrate(15);
  save();
  updateCard(dayId,idx);
}
function removeSet(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  const s=sessionFor(curDate(),dayId,e.nome,e.series);
  if(!s.extra)return;
  s.extra-=1;
  s.sets=s.sets.slice(0,setCount(s,e));
  vibrate(15);
  save();
  updateCard(dayId,idx);
}

function save(){localStorage.setItem("treino-sessoes-ul-v2",JSON.stringify(sessions));localStorage.setItem("treino-ordem-ul-v2",JSON.stringify(exOrder));localStorage.setItem("treino-videos-ok-ul",JSON.stringify(videoOk));localStorage.setItem("treino-videos-ul-v1",JSON.stringify(customVideos));localStorage.setItem("treino-notas-dia-ul-v2",JSON.stringify(dayNotes))}
function sessionFor(date,dayId,exName,series){if(!sessions[date])sessions[date]={};if(!sessions[date][dayId])sessions[date][dayId]={};if(!sessions[date][dayId][exName])sessions[date][dayId][exName]={sets:Array.from({length:series},()=>({load:"",reps:"",rir:"",done:false})),note:"",extra:0};const x=sessions[date][dayId][exName];if(x.extra==null)x.extra=0;const need=series+x.extra;while(x.sets.length<need)x.sets.push({load:"",reps:"",rir:"",done:false});return x}
function getSession(date,dayId,exName){return sessions?.[date]?.[dayId]?.[exName]||null}
function exerciseDone(date,dayId,e){const s=getSession(date,dayId,e.nome);if(!s)return false;const c=setCount(s,e);return s.sets.slice(0,c).length===c&&s.sets.slice(0,c).every(x=>x.done)}
function dayDoneCount(d,date){return d.exercicios.filter(e=>exerciseDone(date||todayISO(),d.id,e)).length}
function completedSetsToday(){let n=0,total=0;DIAS.forEach(d=>d.exercicios.forEach(e=>{total+=e.series;const s=getSession(todayISO(),d.id,e.nome);if(s)n+=s.sets.slice(0,setCount(s,e)).filter(x=>x.done).length}));return{n,total}}
function videoFor(d,e){
  const k=key(d,e.nome),c=customVideos[k];
  if(c?.url)return{url:c.url,fonte:c.fonte||"Vídeo cadastrado por você",custom:true,status:"custom"};
  if(!e.video)return{url:"",fonte:"",custom:false,status:"pending"};
  const st=videoOk[k]?"confirmed":(e.videoStatus||"reference");
  return{url:e.video,fonte:e.fonte||"",custom:false,status:st};
}
function videoLabel(st){
  return st==="custom"?"seu vídeo":st==="confirmed"?"conferido":st==="unverified"?"conferir":st==="pending"?"sem vídeo":"vídeo";
}
function needsReview(){
  const out=[];
  DIAS.forEach(d=>d.exercicios.forEach((e,i)=>{const v=videoFor(d.id,e);if(v.status==="unverified"||v.status==="pending")out.push({d,e,i,v})}));
  return out;
}
function confirmVideo(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  videoOk[key(dayId,e.nome)]=1;
  vibrate(20);
  save();
  render();
}
function unconfirmVideo(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx];
  delete videoOk[key(dayId,e.nome)];
  save();
  render();
}
function isValidUrl(u){try{const x=new URL(u);return x.protocol==="http:"||x.protocol==="https:"}catch{return false}}

function ringSVG(pct,size,stroke,color,track){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle class="ring-fg" data-target="${c*(1-pct)}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function animateRings(){requestAnimationFrame(()=>document.querySelectorAll(".ring-fg").forEach(el=>el.style.strokeDashoffset=el.dataset.target))}
function checkIcon(){return `<svg viewBox="0 0 16 16"><path d="M3 8.5L6.2 11.5L13 4.5"/></svg>`}

function priorSessions(dayId,e){const out=[];Object.keys(sessions).sort().reverse().forEach(date=>{if(date===curDate())return;const s=getSession(date,dayId,e.nome);if(s&&s.sets.some(x=>x.done||x.load||x.reps))out.push({date,...s})});return out}
function legacyHistory(dayId,e){return (legacyLoads[key(dayId,e.nome)]||[]).slice().sort((a,b)=>a.d<b.d?1:-1)}
function sessionSummary(s){const sets=s.sets.filter(x=>x.done||x.load||x.reps);if(!sets.length)return"sem dados";return sets.map(x=>`${x.load?x.load+"kg":"—"} × ${x.reps||"—"}${x.rir!==""?` · RIR ${x.rir}`:""}`).join(" | ")}
function recommendation(e,s){const sets=s.sets.slice(0,e.series);if(!sets.every(x=>x.done))return null;const {lo,hi}=parseRange(e.reps),minR=rirMin(e.rir);const reps=sets.map(x=>Number(x.reps));const rirs=sets.map(x=>Number(x.rir));if(reps.some(Number.isNaN))return{txt:"Treino concluído — registre reps para liberar recomendação.",cls:""};const allTop=reps.every(r=>r>=hi);const allAtLeastLo=reps.every(r=>r>=lo);const rirOk=rirs.every(r=>Number.isNaN(r)||r>=minR);if(allTop&&rirOk)return{txt:"Topo da faixa atingido com RIR adequado — considere subir a carga na próxima sessão.",cls:"good"};if(!allAtLeastLo||rirs.filter(r=>!Number.isNaN(r)&&r===0).length>=2)return{txt:"Desempenho abaixo do alvo ou esforço alto — mantenha a carga e revise execução/recuperação.",cls:"warn"};return{txt:"Boa sessão — mantenha a carga e tente acumular repetições dentro da faixa.",cls:""}}
function trendPoints(dayId,e){const pts=[];Object.keys(sessions).sort().forEach(date=>{const s=getSession(date,dayId,e.nome);if(!s)return;const vals=s.sets.filter(x=>x.done&&x.load).map(x=>Number(x.load)).filter(Number.isFinite);if(vals.length)pts.push({d:date,v:Math.max(...vals)})});legacyHistory(dayId,e).slice().reverse().forEach(h=>{const v=Number(h.v);if(Number.isFinite(v))pts.push({d:h.d,v,legacy:true})});pts.sort((a,b)=>a.d.localeCompare(b.d));return pts.slice(-12)}
function sparkSVG(points,color){const W=100,H=30,pad=3,vals=points.map(p=>p.v),min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1;const c=points.map((p,i)=>({x:(i/(points.length-1||1))*(W-pad*2)+pad,y:H-pad-((p.v-min)/range)*(H-pad*2)}));const line=c.map((p,i)=>(i?"L":"M")+p.x.toFixed(2)+" "+p.y.toFixed(2)).join(" ");return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${c.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="${color}"/>`).join("")}</svg>`}

function backupInfo(){let iso=null;try{iso=localStorage.getItem("treino-ul-ultimo-backup")}catch{}const tem=Object.keys(sessions).length||Object.keys(legacyLoads).length;if(!iso)return{atrasado:!!tem,nunca:true,dias:null};const d=new Date(iso),dias=Math.floor((Date.now()-d)/86400000);return{atrasado:!!tem&&dias>=14,nunca:false,dias,data:d}}

on></div></div><div class="tools"><div class="tooltitle">Dados do treino</div><div class="toolsub">O backup agora inclui registros série por série, notas, vídeos personalizados e também o histórico antigo.</div><div class="toolrow"><button class="toolbtn" data-action="export-backup">Exportar backup</button><button class="toolbtn" data-action="import-backup">Importar backup</button><input id="import-file" type="file" accept="application/json,.json"></div></div></div>`;animateRings()}

    <div class="guide"><b>Como usar:</b> registre carga, reps e RIR de cada série. Ao marcar ✓, o descanso do exercício inicia automaticamente. Só considere subir a carga quando o topo da faixa vier com o RIR planejado.${custom?` <button class="todaybtn" data-action="reset-order" style="margin-top:8px">restaurar ordem original</button>`:""}</div>

    <div class="list">${ord.map(i=>exerciseCard(d,d.exercicios[i],i,date)).join("")}</div>

    <div class="daynote"><label>Nota da sessão</label><textarea data-action="day-note" data-day="${d.id}" placeholder="Ex.: dormi mal, máquina ocupada, joelho ótimo, treino muito forte...">${esc(dayNotes[date]?.[d.id]||"")}</textarea></div>

    <button class="clear" data-action="clear-day">Limpar apenas as marcações de ${isToday()?"hoje":fmtDate(date)}</button>

    <button class="timerfab" id="timer-fab" data-action="timer-toggle">⏱ Descanso</button>
    <div class="timerpanel" id="timer-panel" hidden>
      <div class="timerhead"><b>Timer de descanso</b><button class="timerclose" data-action="timer-toggle">×</button></div>
      <div class="timercontext" id="timer-context">Escolha um tempo ou conclua uma série para iniciar automaticamente.</div>
      <div class="timeropts">${[60,75,90,120,150,180].map(x=>`<button class="timeropt" data-action="timer-start" data-seconds="${x}">${x}s</button>`).join("")}</div>
      <button class="timerstop" data-action="timer-stop">Parar timer</button>
    </div>
  </div>`;

  restoreDetails(st);
  animateRings();
  updateTimerUI();
  requestWakeLock();
}

function exerciseCard(d,e,i,date){
  const s=sessionFor(date,d.id,e.nome,e.series),count=setCount(s,e);
  const done=exerciseDone(date,d.id,e),vid=videoFor(d.id,e),prior=priorSessions(d.id,e),legacy=legacyHistory(d.id,e);
  const prev=prior[0],rec=recommendation(e,s),points=trendPoints(d.id,e);
  const k=key(d.id,e.nome);
  const ord=orderedIdx(d),pos=ord.indexOf(i);

  const previousHtml=prev
    ?`<div class="prevbox"><b>Última sessão ${fmtDate(prev.date)}</b><br>${esc(sessionSummary(prev))}</div>`
    :legacy[0]
      ?`<div class="prevbox legacy"><b>Histórico antigo ${fmtDate(legacy[0].d)}</b><br>${esc(legacy[0].v||"—")}kg${legacy[0].r!=null?` · ${legacy[0].r} reps`:""}</div>`
      :`<div class="prevbox">Primeira sessão detalhada neste exercício.</div>`;

  const history=[
    ...prior.slice(0,6).map(x=>`<div class="histitem"><b>${fmtDate(x.date)}</b><br>${esc(sessionSummary(x))}${x.note?`<br>Nota: ${esc(x.note)}`:""}</div>`),
    ...legacy.slice(0,4).map(h=>`<div class="histitem legacy"><b>${fmtDate(h.d)} · histórico antigo</b><br>${esc(h.v||"—")}kg${h.r!=null?` · ${h.r} reps`:""}</div>`)
  ].join("");

  const spark=points.length>=2
    ?`<div class="spark"><div class="sparkhead"><span>Evolução da melhor carga</span><span>${points[0].v} → ${points.at(-1).v}kg</span></div>${sparkSVG(points,d.cor)}<div class="sparkfoot"><span>${fmtDate(points[0].d)}</span><span>${fmtDate(points.at(-1).d)}</span></div></div>`
    :"";

  const rows=s.sets.slice(0,count).map((x,si)=>`<div class="setrow ${si>=e.series?"bonus":""}">
    <div class="setlabel">${si>=e.series?"+"+(si-e.series+1):si+1}</div>
    <input class="field" inputmode="decimal" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="load" placeholder="kg" value="${esc(x.load)}">
    <input class="field" inputmode="numeric" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="reps" placeholder="reps" value="${esc(x.reps)}">
    <input class="field" inputmode="numeric" data-action="set-field" data-day="${d.id}" data-idx="${i}" data-set="${si}" data-field="rir" placeholder="RIR" value="${esc(x.rir)}">
    <button class="setdone ${x.done?"on":""}" data-action="toggle-set" data-day="${d.id}" data-idx="${i}" data-set="${si}">${x.done?"✓":"○"}</button>
  </div>`).join("");

  return `<div class="card ${done?"done":""}" data-card="${d.id}|${i}">
    <div class="cardhead">
      <div style="min-width:0">
        <div class="meta" style="color:${d.cor}">${e.grupo}</div>
        <div class="exname">${e.nome}${e.ancora?'<span class="anchor">âncora</span>':""}<span class="videobadge ${vid.status==="pending"||vid.status==="unverified"?"pending":"ok"}">${videoLabel(vid.status)}</span></div>
      </div>
      <div class="movebox">
        <button class="movebtn" data-action="move-up" data-day="${d.id}" data-idx="${i}" ${pos<=0?"disabled":""} aria-label="Subir">↑</button>
        <button class="movebtn" data-action="move-down" data-day="${d.id}" data-idx="${i}" ${pos>=ord.length-1?"disabled":""} aria-label="Descer">↓</button>
        <button class="checkex ${done?"on":""}" data-action="toggle-ex" data-day="${d.id}" data-idx="${i}">${checkIcon()}</button>
      </div>
    </div>

    <div class="sets">${e.series} × ${e.reps} reps · <span class="rir">RIR ${e.rir}</span> · descanso ${Math.round(e.rest/60*10)/10} min</div>
    ${vid.fonte?`<div class="source">${esc(vid.fonte)}</div>`:""}

    <details class="tech" data-dk="tech|${k}"><summary>Técnica e erros comuns</summary><div class="techbody">
      <b>Pontos-chave</b><ul>${e.dicas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <b class="mistake">Evite</b><ul>${e.erros.map(x=>`<li class="mistake">${esc(x)}</li>`).join("")}</ul>
      <div class="videorow">${vid.url
        ?`<a class="watch" style="color:${d.cor};border-color:${d.cor}" href="${vid.url}" target="_blank" rel="noopener noreferrer">▶ Ver execução</a><button class="editvid" data-action="set-video" data-day="${d.id}" data-idx="${i}">${vid.custom?"editar vídeo":"trocar vídeo"}</button>`
        :`<span class="novideo">Ainda sem vídeo validado.</span><button class="vidbtn" data-action="set-video" data-day="${d.id}" data-idx="${i}">adicionar link</button>`}</div>
    </div></details>

    ${previousHtml}

    <div class="sethead"><span>Série</span><span>Carga kg</span><span>Reps</span><span>RIR</span><span>✓</span></div>
    <div class="settable">${rows}</div>

    <div class="setextra">
      <button data-action="add-set" data-day="${d.id}" data-idx="${i}">＋ série extra</button>
      ${s.extra?`<button data-action="remove-set" data-day="${d.id}" data-idx="${i}">− remover extra</button>`:""}
    </div>

    <div class="autotimer">✓ Concluir série inicia ${e.rest}s de descanso automaticamente.</div>

    <textarea class="note" data-action="ex-note" data-day="${d.id}" data-idx="${i}" placeholder="Observação do exercício: banco posição 4, máquina diferente, desconforto, execução...">${esc(s.note||"")}</textarea>

    ${rec?`<div class="recommend ${rec.cls}">${rec.txt}</div>`:""}
    ${history||spark?`<details class="hist" data-dk="hist|${k}"><summary>Histórico e evolução</summary>${spark}<div class="histlist">${history}</div></details>`:""}
  </div>`
}

function updateCard(dayId,idx){
  const d=DIAS.find(x=>x.id===dayId);
  if(!d)return;
  const el=document.querySelector('.card[data-card="'+dayId+"|"+idx+'"]');
  if(!el){renderDay();return}
  const st=detailsState();
  el.outerHTML=exerciseCard(d,d.exercicios[idx],idx,curDate());
  restoreDetails(st);
  updateDayHeader();
}

function updateDayHeader(){
  const d=DIAS.find(x=>x.id===active);
  const box=document.getElementById("day-progress");
  if(!d||!box)return;
  const n=dayDoneCount(d,curDate());
  box.innerHTML=`${ringSVG(n/d.exercicios.length,30,4,d.cor,"#2A2D33")}<div>${n}/${d.exercicios.length} feitos</div>`;
  animateRings();
}

function render(){if(active==="__videos")renderPending();else if(active)renderDay();else renderHome()}

function setField(dayId,idx,setIdx,field,val){const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx],s=sessionFor(curDate(),dayId,e.nome,e.series);val=String(val).trim().replace(",",".");if(val!==""&&!Number.isFinite(Number(val)))return;s.sets[setIdx][field]=val;save()}
function toggleSet(dayId,idx,setIdx){const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx],s=sessionFor(curDate(),dayId,e.nome,e.series),x=s.sets[setIdx];x.done=!x.done;vibrate(x.done?[30,40]:15);save();if(x.done&&isToday())startTimer(e.rest,e.nome);updateCard(dayId,idx)}
function toggleExercise(dayId,idx){const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx],s=sessionFor(curDate(),dayId,e.nome,e.series),c=setCount(s,e),newState=!s.sets.slice(0,c).every(x=>x.done);s.sets.slice(0,c).forEach(x=>x.done=newState);vibrate([30,40]);save();updateCard(dayId,idx)}
function setExNote(dayId,idx,val){const d=DIAS.find(x=>x.id===dayId),e=d.exercicios[idx],s=sessionFor(curDate(),dayId,e.nome,e.series);s.note=val;save()}
function setDayNote(dayId,val){const date=curDate();if(!dayNotes[date])dayNotes[date]={};dayNotes[date][dayId]=val;save()}
function setVideo(id,i){const ex=DIAS.find(x=>x.id===id).exercicios[i],k=key(id,ex.nome),current=customVideos[k]?.url||ex.video||"";const raw=prompt(ex.nome+"\n\nCole o link do vídeo de execução. Deixe vazio para voltar ao vídeo padrão/remover.",current);if(raw===null)return;const url=raw.trim();if(!url){delete customVideos[k];save();render();return}if(!isValidUrl(url)){alert("Link inválido. Use https://");return}const fonte=(prompt("Nome do canal ou referência (opcional):",customVideos[k]?.fonte||"")||"").trim();customVideos[k]={url,fonte};save();render()}
function clearDay(){const date=curDate();if(!confirm("Limpar apenas as marcações ✓ de "+(date===todayISO()?"hoje":fmtDate(date))+"? Carga, reps, RIR e notas serão mantidos."))return;const d=DIAS.find(x=>x.id===active);d.exercicios.forEach(e=>{const s=getSession(date,d.id,e.nome);if(s)s.sets.forEach(x=>x.done=false)});save();renderDay()}

let timerEnd=0,timerInterval=null,timerLabel="";
function persistTimer(){
  try{
    if(timerEnd)localStorage.setItem("treino-timer-ul",JSON.stringify({end:timerEnd,label:timerLabel}));
    else localStorage.removeItem("treino-timer-ul");
  }catch(e){}
}
// o iOS congela o app em segundo plano: retoma o descanso pelo horario-alvo salvo
function restoreTimer(){
  try{
    const raw=localStorage.getItem("treino-timer-ul");
    if(!raw){timerEnd=0;updateTimerUI();return}
    const t=JSON.parse(raw);
    if(!t||!t.end||t.end<=Date.now()){localStorage.removeItem("treino-timer-ul");timerEnd=0;updateTimerUI();return}
    timerEnd=t.end;timerLabel=t.label||"";
    if(timerInterval)clearInterval(timerInterval);
    timerInterval=setInterval(updateTimerUI,250);
    updateTimerUI();
  }catch(e){}
}
function formatTimer(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(seconds,label=""){timerEnd=Date.now()+seconds*1000;timerLabel=label;persistTimer();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerUI,250);const p=document.getElementById("timer-panel");if(p)p.hidden=true;updateTimerUI()}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerEnd=0;timerLabel="";persistTimer();updateTimerUI()}
function updateTimerUI(){const fab=document.getElementById("timer-fab"),ctx=document.getElementById("timer-context");if(!fab)return;if(!timerEnd){fab.textContent="⏱ Descanso";fab.classList.remove("running");return}const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));fab.textContent="⏱ "+formatTimer(left);fab.classList.add("running");if(ctx&&timerLabel)ctx.textContent=timerLabel+" · descanso em andamento";if(left<=0){clearInterval(timerInterval);timerInterval=null;timerEnd=0;timerLabel="";persistTimer();fab.textContent="✓ Descanso";fab.classList.remove("running");vibrate([200,100,200,100,300]);setTimeout(updateTimerUI,1800)}}
function toggleTimerPanel(){const p=document.getElementById("timer-panel");if(p)p.hidden=!p.hidden}

const ANILHAS=[25,20,15,10,5,2.5,1.25];
function openPlateCalculator(){
  vibrate(15);
  document.getElementById("modal-root").innerHTML=`<div class="modal-overlay" data-action="close-calc"><div class="modal" data-stop="1">
    <div class="modal-title"><span>Calculadora de anilhas</span><button class="modal-close" data-action="close-calc">×</button></div>
    <div class="modal-field"><label>Peso total desejado (barra + anilhas, kg)</label><input type="number" id="calc-total" class="modal-input" placeholder="Ex: 80" inputmode="decimal" step="0.5"></div>
    <div class="modal-field"><label>Peso da barra (kg)</label><input type="number" id="calc-bar" class="modal-input" value="20" inputmode="decimal" step="0.5"></div>
    <button class="toolbtn" style="width:100%" data-action="calc-plates">Calcular por lado</button>
    <div id="calc-output"></div>
  </div></div>`;
  const t=document.getElementById("calc-total");if(t)t.focus();
}
function closePlateCalculator(){const r=document.getElementById("modal-root");if(r)r.innerHTML=""}
function computePlates(){
  const out=document.getElementById("calc-output");if(!out)return;
  const total=parseFloat(String(document.getElementById("calc-total").value).replace(",","."));
  const bar=parseFloat(String(document.getElementById("calc-bar").value).replace(",","."))||0;
  if(!Number.isFinite(total)){out.innerHTML=`<div class="plate-result err">Informe o peso total.</div>`;return}
  if(total<bar){out.innerHTML=`<div class="plate-result err">O peso total não pode ser menor que a barra.</div>`;return}
  if(total===bar){out.innerHTML=`<div class="plate-result">Só a barra — sem anilhas.</div>`;return}
  let rem=Math.round(((total-bar)/2)*100)/100;
  const usadas=[];
  for(const pl of ANILHAS){const c=Math.floor(rem/pl);if(c>0){usadas.push(c+"× "+pl+"kg");rem=Math.round((rem-c*pl)*100)/100}}
  const sobra=rem>0?`<br><small>Faltam ${rem}kg por lado — o mais próximo montável é ${total-rem*2}kg.</small>`:"";
  out.innerHTML=`<div class="plate-result"><b>Por lado da barra:</b><br>${usadas.length?usadas.join("<br>"):"—"}${sobra}</div>`;
  vibrate(15);
}

function pendingVideos(){return needsReview()}
function renderPending(){

  const todos=[];
  DIAS.forEach(d=>d.exercicios.forEach((e,i)=>todos.push({d,e,i,v:videoFor(d.id,e)})));
  const rever=todos.filter(x=>x.v.status==="unverified"||x.v.status==="pending");
  const ok=todos.filter(x=>x.v.status==="confirmed"||x.v.status==="custom");
  const ref=todos.filter(x=>x.v.status==="reference");

  const card=({d,e,i,v})=>`<div class="vidcard">
    <div class="vday" style="color:${d.cor}">${d.label} · ${d.foco}</div>
    <div class="vname">${esc(e.nome)}<span class="videobadge ${v.status==="pending"||v.status==="unverified"?"pending":"ok"}">${videoLabel(v.status)}</span></div>
    <div class="vgrp">${e.grupo} · ${e.series} × ${e.reps} · RIR ${e.rir}</div>
    ${v.fonte?`<div class="vsrc">${esc(v.fonte)}</div>`:""}
    <div class="vidactions">
      ${v.url?`<a href="${v.url}" target="_blank" rel="noopener noreferrer">▶ abrir</a>`:""}
      <a class="searchlink" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.nome+" execução")}" target="_blank" rel="noopener noreferrer">buscar</a>
      <button data-action="set-video" data-day="${d.id}" data-idx="${i}">${v.url?"trocar":"colar link"}</button>
    </div>
    ${v.url&&v.status!=="custom"
      ? v.status==="confirmed"
        ? `<button class="vidconfirm done" data-action="unconfirm-video" data-day="${d.id}" data-idx="${i}">✓ conferido — desmarcar</button>`
        : `<button class="vidconfirm" data-action="confirm-video" data-day="${d.id}" data-idx="${i}">marcar como conferido</button>`
      :""}
  </div>`;

  app.innerHTML=`<div class="wrap">
    <div class="top">
      <button class="back" data-action="back">‹ Semana</button>
      <div class="toprow"><div>
        <div class="workout-title">Revisar vídeos</div>
        <div class="focus2" style="color:#D4A72C">${rever.length} para conferir · ${ok.length+ref.length} prontos</div>
      </div></div>
    </div>

    <div class="guide"><b>Por que esta tela existe:</b> os links marcados como "conferir" foram sugeridos automaticamente e ninguém validou se o vídeo é do exercício certo. Abra, veja se bate com o movimento e o equipamento da sua academia, e então marque como conferido — ou cole outro link.</div>

    ${rever.length?`<div class="vsection">Para conferir (${rever.length})</div><div class="vidlist">${rever.map(card).join("")}</div>`:`<div class="vidempty">Nada pendente de conferência.</div>`}
    ${ref.length?`<div class="vsection">Referências já em uso (${ref.length})</div><div class="vidlist">${ref.map(card).join("")}</div>`:""}
    ${ok.length?`<div class="vsection">Conferidos e personalizados (${ok.length})</div><div class="vidlist">${ok.map(card).join("")}</div>`:""}
  </div>`;
}

function exportBackup(){const payload={app:"Upper/Lower",version:6,exportedAt:new Date().toISOString(),sessions,dayNotes,customVideos,legacyLoads,legacyDone,exOrder,videoOk};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="upper-lower-v2-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);localStorage.setItem("treino-ul-ultimo-backup",new Date().toISOString())}
function chooseBackup(){document.getElementById("import-file")?.click()}
async function importBackupFile(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=="object")throw new Error();if(!confirm("Restaurar este backup? Os dados atuais serão substituídos."))return;if(data.version>=5){sessions=data.sessions||{};dayNotes=data.dayNotes||{};customVideos=data.customVideos||{};legacyLoads=data.legacyLoads||{};legacyDone=data.legacyDone||{};exOrder=data.exOrder||{};videoOk=data.videoOk||{}}else{legacyLoads=data.loads||legacyLoads;legacyDone=data.doneWeeks||legacyDone;customVideos=data.customVideos||customVideos}savingLegacy();save();alert("Backup restaurado.");render()}catch{alert("Backup inválido ou incompatível.")}}
function savingLegacy(){localStorage.setItem("treino-cargas-ul-v1",JSON.stringify(legacyLoads));localStorage.setItem("treino-feitos-ul-v1",JSON.stringify(legacyDone))}

document.addEventListener("click",ev=>{
  const ov=ev.target.closest(".modal-overlay");
  if(ov&&!ev.target.closest("[data-stop]")){closePlateCalculator();return}
  const el=ev.target.closest("[data-action]");
  if(!el||el.disabled)return;
  const a=el.dataset.action;
  if(a==="open-day"){active=el.dataset.day;viewDate=todayISO();render()}
  else if(a==="back"){releaseWakeLock();active=null;viewDate=null;render()}
  else if(a==="open-pending"){active="__videos";render()}
  else if(a==="toggle-set")toggleSet(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set));
  else if(a==="toggle-ex")toggleExercise(el.dataset.day,Number(el.dataset.idx));
  else if(a==="add-set")addSet(el.dataset.day,Number(el.dataset.idx));
  else if(a==="remove-set")removeSet(el.dataset.day,Number(el.dataset.idx));
  else if(a==="move-up")moveExercise(el.dataset.day,Number(el.dataset.idx),-1);
  else if(a==="move-down")moveExercise(el.dataset.day,Number(el.dataset.idx),1);
  else if(a==="reset-order")resetOrder();
  else if(a==="date-prev")shiftDate(-1);
  else if(a==="date-next")shiftDate(1);
  else if(a==="date-today"){viewDate=todayISO();renderDay()}
  else if(a==="set-video")setVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="confirm-video")confirmVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="unconfirm-video")unconfirmVideo(el.dataset.day,Number(el.dataset.idx));
  else if(a==="clear-day")clearDay();
  else if(a==="timer-toggle")toggleTimerPanel();
  else if(a==="timer-start")startTimer(Number(el.dataset.seconds));
  else if(a==="timer-stop")stopTimer();
  else if(a==="open-calc")openPlateCalculator();
  else if(a==="close-calc")closePlateCalculator();
  else if(a==="calc-plates")computePlates();
  else if(a==="export-backup")exportBackup();
  else if(a==="import-backup")chooseBackup();
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.action==="ex-note")setExNote(el.dataset.day,Number(el.dataset.idx),el.value);
  else if(el.dataset.action==="day-note")setDayNote(el.dataset.day,el.value);
});
// carga/reps/RIR salvam ao sair do campo, para nao gravar valores parciais
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.action==="set-field"){setField(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set),el.dataset.field,el.value);updateCard(el.dataset.day,Number(el.dataset.idx))}
  else if(el.dataset.action==="date-pick")setDate(el.value);
});
document.addEventListener("focusout",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.action==="set-field")setField(el.dataset.day,Number(el.dataset.idx),Number(el.dataset.set),el.dataset.field,el.value);
});
document.addEventListener("change",ev=>{if(ev.target?.id==="import-file"){importBackupFile(ev.target.files?.[0]);ev.target.value=""}});
// Versão de arquivo único: sem service worker (ele exige um arquivo .js separado).
// O app continua funcionando instalado na tela de início; o cache normal do
// navegador cobre a maior parte do uso offline.
render();restoreTimer();
